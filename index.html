SK.l4_chanle=()=>{const n=R(100,99999);if(Math.random()<.6)return ch(`Số <b>${fmt(n)}</b> là:`,n%2?'Số lẻ':'Số chẵn',[n%2?'Số chẵn':'Số lẻ'],{keep:true,hint:'Số có chữ số tận cùng là 0, 2, 4, 6, 8 là số chẵn. Tận cùng là 1, 3, 5, 7, 9 là số lẻ.',explain:`Chữ số tận cùng là ${n%10} nên ${fmt(n)} là ${n%2?'số lẻ':'số chẵn'}.`});const odd=Math.random()<.5;const ans=n+(odd?(n%2?2:1):(n%2?1:2));return {text:`Số ${odd?'lẻ':'chẵn'} liền sau số ${fmt(n)} là:`,answer:ans,hint:'Hai số chẵn (hoặc hai số lẻ) liên tiếp hơn kém nhau 2 đơn vị.',explain:`Số ${odd?'lẻ':'chẵn'} liền sau ${fmt(n)} là ${fmt(ans)}.`}};
SK.l4_btchu=()=>{const t=R(0,3),a=R(5,99),b=R(2,9),c=R(10,50);
  if(t===0)return {text:`Tính giá trị của biểu thức <b>a + ${c}</b> với a = ${a}.`,answer:a+c,hint:'Thay chữ a bằng số rồi tính.',explain:`a + ${c} = ${a} + ${c} = ${a+c}`};
  if(t===1)return {text:`Tính giá trị của biểu thức <b>${c+a} − a</b> với a = ${a}.`,answer:c,hint:'Thay chữ a bằng số rồi tính.',explain:`${c+a} − ${a} = ${c}`};
  if(t===2)return {text:`Tính giá trị của biểu thức <b>a × b</b> với a = ${a}, b = ${b}.`,answer:a*b,hint:'Thay a và b bằng các số đã cho rồi tính.',explain:`a × b = ${a} × ${b} = ${a*b}`};
  const x=R(3,30),y=R(2,20);return {text:`Chu vi hình chữ nhật được tính theo công thức <b>P = (a + b) × 2</b>. Tính P với a = ${x} cm, b = ${y} cm.`,unit:'cm',answer:(x+y)*2,hint:'Thay a, b bằng số rồi tính trong ngoặc trước.',explain:`P = (${x} + ${y}) × 2 = ${x+y} × 2 = ${(x+y)*2} (cm)`}};
SK.l4_babuoc=()=>{if(Math.random()<.5){const n1=R(2,5),p1=R(3,9)*1000,n2=R(1,3),p2=R(2,8)*1000;const tot=n1*p1+n2*p2,g=Math.ceil((tot+1000)/10000)*10000;return {text:`Mẹ mua ${n1} quyển vở, mỗi quyển giá ${fmt(p1)} đồng và ${n2} cái bút, mỗi cái giá ${fmt(p2)} đồng. Mẹ đưa cô bán hàng ${fmt(g)} đồng. Hỏi cô bán hàng trả lại mẹ bao nhiêu tiền?`,unit:'đồng',answer:g-tot,hint:'Bước 1: tiền vở. Bước 2: tiền bút. Bước 3: lấy số tiền đưa trừ tổng tiền phải trả.',explain:`Tiền vở: ${n1} × ${fmt(p1)} = ${fmt(n1*p1)}. Tiền bút: ${n2} × ${fmt(p2)} = ${fmt(n2*p2)}. Trả lại: ${fmt(g)} − ${fmt(tot)} = ${fmt(g-tot)} (đồng).`}}const a=R(20,60),b=R(5,20),k=R(2,4);return {text:`Ngày thứ nhất cửa hàng bán được ${a} kg gạo. Ngày thứ hai bán được nhiều hơn ngày thứ nhất ${b} kg. Ngày thứ ba bán được gấp ${k} lần ngày thứ nhất. Hỏi cả ba ngày bán được bao nhiêu ki-lô-gam gạo?`,unit:'kg',answer:a+(a+b)+a*k,hint:'Tìm lần lượt số gạo bán ngày thứ hai, ngày thứ ba, rồi cộng cả ba ngày.',explain:`Ngày 2: ${a} + ${b} = ${a+b}. Ngày 3: ${a} × ${k} = ${a*k}. Cả ba ngày: ${a} + ${a+b} + ${a*k} = ${a+(a+b)+a*k} (kg).`}};
SK.l4_dogoc=()=>pick([{text:'Góc vuông có số đo bằng bao nhiêu độ?',unit:'°',answer:90,hint:'Góc vuông là góc ở góc trang vở.',explain:'Góc vuông bằng 90°.'},{text:'Góc bẹt có số đo bằng bao nhiêu độ?',unit:'°',answer:180,hint:'Góc bẹt có hai cạnh nằm trên một đường thẳng, bằng hai góc vuông.',explain:'Góc bẹt bằng 180°.'},{text:'Góc bẹt bằng mấy góc vuông?',unit:'góc vuông',answer:2,hint:'90° + 90° = ?',explain:'180° = 2 × 90°: góc bẹt bằng 2 góc vuông.'},(()=>{const d=pick([30,45,60,120,135,150]);return ch(`Góc có số đo <b>${d}°</b> là:`,d<90?'Góc nhọn':'Góc tù',['Góc vuông','Góc bẹt',d<90?'Góc tù':'Góc nhọn'],{keep:true,hint:'Góc nhọn bé hơn 90°. Góc tù lớn hơn 90° nhưng bé hơn 180°.',explain:`${d}° ${d<90?'bé hơn 90° nên là góc nhọn':'lớn hơn 90° và bé hơn 180° nên là góc tù'}.`})})()]);
SK.l4_loaigoc=()=>{const t=pick(['Góc nhọn','Góc vuông','Góc tù','Góc bẹt']);const deg={'Góc nhọn':pick([35,50,65]),'Góc vuông':90,'Góc tù':pick([115,130,150]),'Góc bẹt':180}[t];return {text:'Góc dưới đây là góc gì?',fig:angleSVG(deg),kind:'choice',keep:true,choices:['Góc nhọn','Góc vuông','Góc tù','Góc bẹt'],answer:t,hint:'So với góc vuông (góc trang vở): bé hơn là góc nhọn, lớn hơn là góc tù. Hai cạnh thẳng hàng là góc bẹt.',explain:`Đây là ${t.toLowerCase()}.`}};

SK.l4_dayso=()=>{const t=R(0,2);if(t===0){const n=pick([9999,99999,999999,1000000-1,R(1000,999998)]);return {text:`Số tự nhiên liền sau số ${fmt(n)} là:`,answer:n+1,hint:'Thêm 1 vào số đó.',explain:`${fmt(n)} + 1 = ${fmt(n+1)}`}}if(t===1){const a=R(1,20),d=R(2,9);const s=[a,a+d,a+2*d,a+3*d];return {text:`Viết số tiếp theo của dãy: ${s.join('; ')}; …`,answer:a+4*d,hint:'Tìm xem mỗi số hơn số đứng trước bao nhiêu.',explain:`Mỗi số hơn số trước ${d}: ${a+3*d} + ${d} = ${a+4*d}`}}return pick([{text:'Số tự nhiên bé nhất là số nào?',answer:0,hint:'Dãy số tự nhiên bắt đầu từ số nào?',explain:'Số tự nhiên bé nhất là 0.'},{text:'Hai số tự nhiên liên tiếp hơn kém nhau bao nhiêu đơn vị?',answer:1,hint:'Ví dụ: 7 và 8.',explain:'Hai số tự nhiên liên tiếp hơn kém nhau 1 đơn vị.'}])};

SK.l4_giaythe=()=>{const t=R(0,2);if(t===0)return pick([{text:'1 phút bằng bao nhiêu giây?',unit:'giây',answer:60,hint:'Kim giây chạy hết một vòng là 1 phút.',explain:'1 phút = 60 giây.'},{text:'1 thế kỉ bằng bao nhiêu năm?',unit:'năm',answer:100,hint:'Thế kỉ là đơn vị đo thời gian rất dài.',explain:'1 thế kỉ = 100 năm.'},(()=>{const k=R(2,5);return {text:`${k} phút bằng bao nhiêu giây?`,unit:'giây',answer:k*60,hint:'1 phút = 60 giây.',explain:`${k} × 60 = ${k*60} (giây)`}})()]);const y=t===1?R(1801,2099):pick([1945,1975,2000,2001,2026,1010,1802]);const c=Math.floor((y-1)/100)+1;return ch(`Năm <b>${y}</b> thuộc thế kỉ nào?`,`Thế kỉ ${roman(c)}`,[c-1,c+1,c+2].filter(x=>x>0).map(x=>`Thế kỉ ${roman(x)}`),{hint:'Từ năm 1 đến năm 100 là thế kỉ I, từ năm 101 đến năm 200 là thế kỉ II… Năm 2001 đến 2100 là thế kỉ XXI.',explain:`Năm ${y} thuộc thế kỉ ${roman(c)} (thế kỉ ${c}).`})};

SK.l4_phanphoi=()=>{const a=R(12,99),[b,c]=pick([[6,4],[7,3],[8,2],[45,55],[37,63],[9,1]]);return Math.random()<.5?{text:`Tính bằng cách thuận tiện: <b>${a} × ${b} + ${a} × ${c}</b>`,answer:a*(b+c),hint:`Đưa về ${a} × (${b} + ${c}).`,explain:`${a} × (${b} + ${c}) = ${a} × ${b+c} = ${a*(b+c)}`}:{text:`Tính bằng cách thuận tiện: <b>${a} × ${b+c+10} − ${a} × 10</b>`,answer:a*(b+c),hint:`Đưa về ${a} × (${b+c+10} − 10).`,explain:`${a} × (${b+c+10} − 10) = ${a} × ${b+c} = ${a*(b+c)}`}};
SK.l4_nhan2cs=()=>{const a=R(102,999),b=R(11,99);return eq(`${a} × ${b} = ?`,{answer:a*b,hint:`Nhân ${a} với chữ số hàng đơn vị của ${b}, rồi với chữ số hàng chục (viết lùi sang trái một cột), sau đó cộng hai tích riêng.`,explain:`${a} × ${b%10} = ${a*(b%10)}; ${a} × ${Math.floor(b/10)} = ${a*Math.floor(b/10)} (viết lùi một cột). Cộng lại: ${fmt(a*b)}.`})};

SK.l4_tbc=()=>{const n=R(2,4),avg=R(15,80);let xs;do{xs=[];for(let i=0;i<n-1;i++)xs.push(avg+R(-12,12));xs.push(avg*n-xs.reduce((s,v)=>s+v,0))}while(xs[n-1]<1);const sum=xs.reduce((s,v)=>s+v,0);return {text:`Tìm số trung bình cộng của các số: ${xs.join('; ')}.`,answer:avg,hint:`Cộng tất cả các số lại rồi chia cho ${n} (vì có ${n} số).`,explain:`(${xs.join(' + ')}) : ${n} = ${sum} : ${n} = ${avg}`}};

SK.l4_daysl=()=>{const n=R(5,7),xs=Array.from({length:n},()=>R(120,145));const t=R(0,2);const lbl=`Chiều cao (cm) của một nhóm bạn: <b>${xs.join('; ')}</b>.`;if(t===0)return {text:`${lbl} Dãy số liệu có bao nhiêu số?`,answer:n,hint:'Đếm số các số liệu trong dãy.',explain:`Dãy có ${n} số liệu.`};if(t===1)return {text:`${lbl} Bạn cao nhất cao bao nhiêu xăng-ti-mét?`,unit:'cm',answer:Math.max(...xs),hint:'Tìm số lớn nhất trong dãy.',explain:`Số lớn nhất là ${Math.max(...xs)}.`};return {text:`${lbl} Bạn cao nhất cao hơn bạn thấp nhất bao nhiêu xăng-ti-mét?`,unit:'cm',answer:Math.max(...xs)-Math.min(...xs),hint:'Lấy số lớn nhất trừ số bé nhất.',explain:`${Math.max(...xs)} − ${Math.min(...xs)} = ${Math.max(...xs)-Math.min(...xs)} (cm)`}};
SK.l4_bdcot=()=>{const lab=['Lớp 4A','Lớp 4B','Lớp 4C','Lớp 4D'],v=lab.map(()=>R(2,9)*5);const t=R(0,1),i=R(0,3);const fig=barChart(lab.map(x=>x.slice(4)),v,5);if(t===0)return {text:`Biểu đồ cột cho biết số quyển sách mỗi lớp quyên góp. Lớp <b>${lab[i].slice(4)}</b> quyên góp được bao nhiêu quyển?`,fig,unit:'quyển',answer:v[i],hint:'Nhìn đỉnh cột của lớp đó ngang với vạch số nào.',explain:`Lớp ${lab[i].slice(4)}: ${v[i]} quyển.`};let j=R(0,3);while(j===i)j=R(0,3);const [a,b]=v[i]>=v[j]?[i,j]:[j,i];return {text:`Biểu đồ cột cho biết số quyển sách mỗi lớp quyên góp. Lớp ${lab[a].slice(4)} quyên góp nhiều hơn lớp ${lab[b].slice(4)} bao nhiêu quyển?`,fig,unit:'quyển',answer:v[a]-v[b],hint:'Đọc số của từng lớp trên biểu đồ rồi trừ.',explain:`${v[a]} − ${v[b]} = ${v[a]-v[b]} (quyển)`}};
SK.l4_solan=()=>{const n=pick([10,20,30]),k=R(2,n-2);return Math.random()<.5?{text:`Tung một đồng xu ${n} lần, có ${k} lần xuất hiện mặt sấp. Hỏi có bao nhiêu lần xuất hiện mặt ngửa?`,unit:'lần',answer:n-k,hint:'Mỗi lần tung chỉ ra mặt sấp hoặc mặt ngửa.',explain:`${n} − ${k} = ${n-k} (lần)`}:{text:`Gieo xúc xắc ${n} lần, mặt 6 chấm xuất hiện ${Math.min(k,9)} lần. Mặt 6 chấm xuất hiện bao nhiêu lần?`,unit:'lần',answer:Math.min(k,9),hint:'Đọc kĩ đề: số lần đã cho sẵn.',explain:`Mặt 6 chấm xuất hiện ${Math.min(k,9)} lần.`}};
SK.l4_ps_hinh=()=>{const n=R(3,8),k=R(1,n-1);return {text:'Viết phân số chỉ phần đã tô màu của hình.',speak:'Viết phân số chỉ phần đã tô màu của hình.',fig:fracShapeSVG(n,k,pick(['chữ nhật','tròn'])),kind:'frac',answer:[k,n],exact:true,hint:'Mẫu số là số phần bằng nhau của cả hình. Tử số là số phần đã tô màu.',explain:`Hình chia ${n} phần bằng nhau, tô ${k} phần: ${k}/${n}.`}};

SK.l4_ps_bang=()=>{const a=R(1,6),b=R(a+1,9),k=R(2,6);return Math.random()<.5?{html:`${F(a,b)} = ${F('?',b*k)}`,speak:`${fracTxt(a,b)} bằng bao nhiêu phần ${b*k}?`,answer:a*k,hint:`${b} nhân với mấy thì được ${b*k}? Nhân cả tử số với số đó.`,explain:`${b*k} : ${b} = ${k}; ${a} × ${k} = ${a*k}. Vậy ${a}/${b} = ${a*k}/${b*k}.`}:{html:`${F(a*k,b*k)} = ${F(a,'?')}`,speak:`${fracTxt(a*k,b*k)} bằng ${a} phần bao nhiêu?`,answer:b,hint:`${a*k} chia cho mấy thì được ${a}? Chia cả mẫu số cho số đó.`,explain:`${a*k} : ${a} = ${k}; ${b*k} : ${k} = ${b}.`}};
SK.l4_rutgon=()=>{const a=R(1,7),b=R(a+1,9);const [x,y]=simp(a,b),k=R(2,6);return fq(`Rút gọn: ${F(x*k,y*k)}`,`Rút gọn phân số ${fracTxt(x*k,y*k)}`,[x,y],{simplest:true,hint:'Chia cả tử số và mẫu số cho cùng một số lớn hơn 1, làm đến khi không chia được nữa.',explain:`${x*k}/${y*k} = ${x}/${y} (cùng chia cho ${k})`})};
SK.l4_quydong=()=>{const b=R(2,6),k=R(2,4),d=b*k,a=R(1,b-1),c=R(1,d-1);const ans=`${F(a*k,d)} và ${F(c,d)}`;const w=new Set([`${F(a,d)} và ${F(c,d)}`,`${F(a*k,d)} và ${F(c*k,d*k)}`,`${F(a+k,d)} và ${F(c,d)}`,`${F(a*k,d*k)} và ${F(c,d)}`,`${F(a,b)} và ${F(c*k,d)}`]);w.delete(ans);return {text:`Quy đồng mẫu số hai phân số ${F(a,b)} và ${F(c,d)}:`,speak:`Quy đồng mẫu số hai phân số ${fracTxt(a,b)} và ${fracTxt(c,d)}`,kind:'choice',choices:shuffle([ans,...[...w].slice(0,3)]),html_choices:true,answer:ans,hint:`${d} chia hết cho ${b}, nên lấy ${d} làm mẫu số chung. Nhân cả tử và mẫu của ${a}/${b} với ${k}.`,explain:`${a}/${b} = ${a*k}/${d}; giữ nguyên ${c}/${d}.`}};
SK.l4_ssps=()=>{const t=R(0,2);let a,b,c,d,hint,ex;
  if(t===0){b=d=R(3,12);a=R(1,b+3);c=R(1,b+3);hint='Hai phân số cùng mẫu số: phân số nào có tử số lớn hơn thì lớn hơn.';ex=`Cùng mẫu số ${b}, so sánh tử số ${a} và ${c}.`}

  else{b=R(2,6);const k=R(2,3);d=b*k;a=R(1,b*2);c=R(1,d*2);hint=`Hai mẫu số khác nhau: quy đồng mẫu số trước. Lấy ${b} × ${k} = ${d}.`;ex=`${fracTxt(a,b)} = ${fracTxt(a*k,d)}; so sánh tử số ${a*k} và ${c}.`}
  const r=cmp(a*d,c*b);return {html:`${F(a,b)}<span class="box">☐</span>${F(c,d)}`,speak:`So sánh ${fracTxt(a,b)} và ${fracTxt(c,d)}.`,kind:'choice',keep:true,choices:CMP,answer:r,hint,explain:ex+` Vậy ${fracTxt(a,b)} ${r} ${fracTxt(c,d)}.`}};
const psOp=(op)=>()=>{const b=R(3,9),k=pick([1,1,2,3]),d=b*k;let a=R(1,b-1);if(a*k<2)a=2;const c=op==='+'?R(1,d-1):R(1,a*k-1);const n=op==='+'?a*k+c:a*k-c;const [x,y]=simp(n,d);return fq(`${F(a,b)} ${op} ${F(c,d)} = ?`,`${fracTxt(a,b)} ${op==='+'?'cộng':'trừ'} ${fracTxt(c,d)}`,[x,y],{hint:k===1?`Cùng mẫu số: ${op==='+'?'cộng':'trừ'} hai tử số, giữ nguyên mẫu số.`:`Quy đồng mẫu số trước: ${a}/${b} = ${a*k}/${d}, rồi ${op==='+'?'cộng':'trừ'} hai tử số.`,explain:`${k>1?`${a}/${b} = ${a*k}/${d}; `:''}${a*k}/${d} ${op} ${c}/${d} = ${n}/${d}${x!==n?` = ${x}/${y}`:''}`})};

/* ===== TOÁN LỚP 5 ===== */
const dec=(n,p)=>Math.round(n*Math.pow(10,p))/Math.pow(10,p);
SK.l5_on_stn=()=>pick([SK.l4_sotrieu,SK.l4_ssnhieu,SK.l4_chanle,SK.l4_dayso])();
SK.l5_on_pt=()=>pick([SK.l4_nhan2cs,SK.l4_chia2cs,SK.l4_tinhchatnhan,SK.l4_phanphoi])();
SK.l5_on_ps=()=>pick([SK.l4_rutgon,SK.l4_ssps,SK.l4_ps_bang,SK.l4_quydong])();
SK.l5_ps_tp=()=>{if(Math.random()<.6){const [b,m]=pick([[2,10],[5,10],[4,100],[20,100],[25,100],[50,100],[8,1000],[125,1000]]);const a=R(1,b-1);return {html:`${F(a,b)} = ${F('?',m)}`,speak:`${fracTxt(a,b)} bằng bao nhiêu phần ${m}?`,answer:a*m/b,hint:`${b} nhân với mấy thì được ${m}? Nhân cả tử số với số đó.`,explain:`${m} : ${b} = ${m/b}; ${a} × ${m/b} = ${a*m/b}. Vậy ${a}/${b} = ${a*m/b}/${m}.`}}const ok=pick([[3,10],[7,100],[13,1000],[9,10]]);return Object.assign(ch('Phân số nào là phân số thập phân?',`${ok[0]}/${ok[1]}`,shuffle(['3/7','5/12','10/3','4/9','7/20']).slice(0,3)),{hint:'Phân số thập phân có mẫu số là 10, 100, 1 000, …',explain:`${ok[0]}/${ok[1]} có mẫu số ${ok[1]} nên là phân số thập phân.`})};
SK.l5_on_ptps=()=>pick([SK.l4_ps_cong,SK.l4_ps_tru,SK.l4_ps_nhan,SK.l4_ps_chiaps])();
const khacMau=(op)=>{let b=R(2,9),d=R(2,9);while(d===b||d%b===0||b%d===0)d=R(2,9);const a=R(1,b-1),c=R(1,d-1);const n=op==='+'?a*d+c*b:a*d-c*b;if(n<=0)return null;const [x,y]=simp(n,b*d);return fq(`${F(a,b)} ${op} ${F(c,d)} = ?`,`${fracTxt(a,b)} ${op==='+'?'cộng':'trừ'} ${fracTxt(c,d)}`,[x,y],{hint:`Quy đồng mẫu số: mẫu số chung có thể lấy là ${b} × ${d} = ${b*d}.`,explain:`${a}/${b} = ${a*d}/${b*d}; ${c}/${d} = ${c*b}/${b*d}. ${a*d}/${b*d} ${op} ${c*b}/${b*d} = ${n}/${b*d}${x!==n?` = ${x}/${y}`:''}.`})};
SK.l5_khacmau=()=>{let q=null;while(!q)q=khacMau(Math.random()<.5?'+':'−');return q};
const hs=(w,a,b)=>`<span class="honso">${w}${F(a,b)}</span>`;
SK.l5_honso=()=>{const b=R(2,9);let a=R(1,b-1);while(gcd(a,b)>1)a=R(1,b-1);const w=R(1,5);if(Math.random()<.5)return fq(`Viết hỗn số ${hs(w,a,b)} thành phân số.`,`Viết hỗn số ${w} và ${fracTxt(a,b)} thành phân số`,[w*b+a,b],{exact:true,hint:'Lấy phần nguyên nhân với mẫu số rồi cộng với tử số, được tử số mới. Mẫu số giữ nguyên.',explain:`${w} × ${b} + ${a} = ${w*b+a}. Vậy ${w} ${a}/${b} = ${w*b+a}/${b}.`});const ans=`${w} ${a}/${b}`;return {html:`Viết phân số ${F(w*b+a,b)} thành hỗn số.`,speak:`Viết phân số ${fracTxt(w*b+a,b)} thành hỗn số`,kind:'choice',choices:shuffle([...new Set([ans,`${w+1} ${a}/${b}`,`${w} ${b-a}/${b}`,`${a} ${w}/${b}`])]).slice(0,4),answer:ans,hint:`Lấy tử số chia cho mẫu số: thương là phần nguyên, số dư là tử số của phần phân số.`,explain:`${w*b+a} : ${b} = ${w} (dư ${a}). Vậy ${w*b+a}/${b} = ${w} ${a}/${b}.`}};
SK.l5_on_hhdl=()=>pick([SK.l3_dtich,SK.l3_chuvi,SK.l4_dvdt,SK.l4_yentaten])();
const HANG_TP=['phần mười','phần trăm','phần nghìn'];
SK.l5_stp_kn=()=>{const t=R(0,2);if(t===0){const [m,p]=pick([[10,1],[100,2],[1000,3]]);const a=R(1,m-1);if(a%10===0&&m>10)return SK.l5_stp_kn();return {html:`Viết ${F(a,m)} dưới dạng số thập phân.`,speak:`Viết ${fracTxt(a,m)} dưới dạng số thập phân`,answer:a/m,hint:`Mẫu số ${m} có ${p} chữ số 0, nên phần thập phân có ${p} chữ số.`,explain:`${a}/${m} = ${fmt(a/m)}`}}if(t===1){const n=R(1000,99999)/1000;const s=fmt(n),dp=s.split(',')[1]||'';if(dp.length<3)return SK.l5_stp_kn();const i=R(0,2);const nm=HANG_TP[i];return ch(`Trong số <b>${s}</b>, chữ số <b>${dp[i]}</b> ở vị trí thứ ${i+1} sau dấu phẩy thuộc hàng nào?`,`Hàng ${nm}`,HANG_TP.filter(x=>x!==nm).map(x=>'Hàng '+x).concat(['Hàng đơn vị']),{hint:'Sau dấu phẩy, lần lượt là hàng phần mười, phần trăm, phần nghìn.',explain:`Chữ số ${dp[i]} thuộc hàng ${nm}.`})}const w=R(1,99),f=R(1,99);const s=`${w},${String(f).padStart(2,'0')}`;const read=`${docSo(w)} phẩy ${f<10?'không '+docSo(f):docSo(f)}`;return ch(`Số thập phân <b>${s}</b> đọc là:`,read,[`${docSo(w)} phẩy ${docSo(f*10>99?f:f*10)}`,`${docSo(f)} phẩy ${docSo(w)}`,`${docSo(w)} ${docSo(f)}`].filter(x=>x!==read),{hint:'Đọc phần nguyên, rồi đọc “phẩy”, rồi đọc phần thập phân.',explain:`${s} đọc là: ${read}.`})};
SK.l5_ss_stp=()=>{const a=R(100,9999)/100;let b=Math.random()<.2?a:dec(a+R(-50,50)/(Math.random()<.5?100:10),2);if(b<=0)b=a;return {eq:`${fmt(a)} ☐ ${fmt(b)}`,speak:`So sánh ${fmt(a)} và ${fmt(b)}`,kind:'choice',keep:true,choices:CMP,answer:cmp(a,b),hint:'So sánh phần nguyên trước. Nếu phần nguyên bằng nhau, so sánh lần lượt hàng phần mười, phần trăm…',explain:`${fmt(a)} ${cmp(a,b)} ${fmt(b)}`}};
SK.l5_viet_stp=()=>{const t=R(0,3);
  if(t===0){const k=R(1,9),g=pick([500,250,750,50,200,125,5,80]);return eq(`${k} kg ${g} g = ? kg`,{speak:`${k} ki lô gam ${g} gam bằng bao nhiêu ki lô gam?`,unit:'kg',answer:k+g/1000,hint:'1 g = 0,001 kg. Phần gam viết thành phần thập phân có ba chữ số.',explain:`${g} g = ${fmt(g/1000)} kg, vậy ${k} kg ${g} g = ${fmt(k+g/1000)} kg.`})}
  if(t===1){const k=R(1,9),c=pick([5,25,40,75,8,60,12]);return eq(`${k} m ${c} cm = ? m`,{speak:`${k} mét ${c} xăng ti mét bằng bao nhiêu mét?`,unit:'m',answer:k+c/100,hint:'1 cm = 0,01 m. Phần xăng-ti-mét viết thành phần thập phân có hai chữ số.',explain:`${c} cm = ${fmt(c/100)} m, vậy ${k} m ${c} cm = ${fmt(k+c/100)} m.`})}
  if(t===2){const k=R(1,9),c=R(1,9);return eq(`${k} tấn ${c} tạ = ? tấn`,{speak:`${k} tấn ${c} tạ bằng bao nhiêu tấn?`,unit:'tấn',answer:k+c/10,hint:'1 tạ = 0,1 tấn.',explain:`${k} tấn ${c} tạ = ${fmt(k+c/10)} tấn.`})}
  const k=R(1,9),c=pick([5,25,75,40,8]);return eq(`${k} m² ${c} dm² = ? m²`,{speak:`${k} mét vuông ${c} đề xi mét vuông bằng bao nhiêu mét vuông?`,unit:'m²',answer:k+c/100,hint:'1 dm² = 0,01 m² (vì 1 m² = 100 dm²).',explain:`${k} m² ${c} dm² = ${fmt(k+c/100)} m².`})};
SK.l5_lamtron_stp=()=>{const n=R(1000,99999)/1000;const [nm,p]=pick([['số tự nhiên gần nhất',0],['hàng phần mười',1],['hàng phần trăm',2]]);const r=dec(Math.round(n*Math.pow(10,p)+1e-9)/Math.pow(10,p),p);return {text:`Làm tròn số ${fmt(n)} đến ${nm}.`,answer:r,hint:'Nhìn chữ số ngay bên phải hàng cần làm tròn: bé hơn 5 thì làm tròn xuống, từ 5 trở lên thì làm tròn lên.',explain:`${fmt(n)} ≈ ${fmt(r)}`}};
SK.l5_ha=()=>{const t=R(0,2),x=R(2,9);if(t===0)return eq(`${x} ha = ? m²`,{speak:`${x} héc ta bằng bao nhiêu mét vuông?`,unit:'m²',answer:x*10000,hint:'1 ha = 10 000 m².',explain:`${x} ha = ${fmt(x*10000)} m².`});if(t===1)return eq(`${x} km² = ? ha`,{speak:`${x} ki lô mét vuông bằng bao nhiêu héc ta?`,unit:'ha',answer:x*100,hint:'1 km² = 100 ha.',explain:`${x} km² = ${x*100} ha.`});return eq(`${x*10000} m² = ? ha`,{speak:`${x*10000} mét vuông bằng bao nhiêu héc ta?`,unit:'ha',answer:x,hint:'1 ha = 10 000 m².',explain:`${fmt(x*10000)} m² = ${x} ha.`})};
SK.l5_dvdt=()=>pick([SK.l4_dvdt,SK.l5_ha,()=>{const k=R(1,9),c=pick([5,25,75,40,8]);return eq(`${k} m² ${c} dm² = ? m²`,{speak:`${k} mét vuông ${c} đề xi mét vuông bằng bao nhiêu mét vuông?`,unit:'m²',answer:k+c/100,hint:'1 m² = 100 dm², nên 1 dm² = 0,01 m².',explain:`${k} m² ${c} dm² = ${fmt(k+c/100)} m².`})}])();
const stp=()=>{const p=pick([1,2]);return [R(105,9999),p]};
SK.l5_cong_stp=()=>{const [A,p]=stp(),[B,q]=stp();const m=100,a=A/Math.pow(10,p),b=B/Math.pow(10,q);const s=dec(a+b,2);return eq(`${fmt(a)} + ${fmt(b)} = ?`,{answer:s,hint:'Đặt tính sao cho các dấu phẩy thẳng cột, cộng như số tự nhiên, rồi đặt dấu phẩy ở kết quả thẳng cột với các dấu phẩy.',explain:`${fmt(a)} + ${fmt(b)} = ${fmt(s)}`})};
SK.l5_tru_stp=()=>{const [A,p]=stp(),[B,q]=stp();let a=A/Math.pow(10,p),b=B/Math.pow(10,q);if(a<b)[a,b]=[b,a];const s=dec(a-b,2);return eq(`${fmt(a)} − ${fmt(b)} = ?`,{answer:s,hint:'Đặt tính sao cho các dấu phẩy thẳng cột. Phần thập phân ít chữ số hơn thì coi như viết thêm chữ số 0 vào bên phải.',explain:`${fmt(a)} − ${fmt(b)} = ${fmt(s)}`})};
SK.l5_nhan_stp=()=>{if(Math.random()<.5){const p=pick([1,2]),A=R(12,999),b=R(2,9);return eq(`${fmt(A/Math.pow(10,p))} × ${b} = ?`,{answer:dec(A*b/Math.pow(10,p),p),hint:`Nhân như số tự nhiên (${A} × ${b}), rồi tách ${p===1?'một':'hai'} chữ số ở phần thập phân.`,explain:`${A} × ${b} = ${A*b}; tách ${p} chữ số: ${fmt(A*b/Math.pow(10,p))}.`})}const A=R(11,99),B=R(11,49);return eq(`${fmt(A/10)} × ${fmt(B/10)} = ?`,{answer:dec(A*B/100,2),hint:`Nhân như số tự nhiên (${A} × ${B}). Hai thừa số có tất cả hai chữ số ở phần thập phân, nên tách hai chữ số ở tích.`,explain:`${A} × ${B} = ${A*B}; tách 2 chữ số: ${fmt(A*B/100)}.`})};
SK.l5_chia_stp=()=>{const t=R(0,2);if(t===0){const d=R(2,9),q=R(11,999)/10;const n=dec(q*d,1);return eq(`${fmt(n)} : ${d} = ?`,{answer:q,hint:'Chia như số tự nhiên. Khi chia đến chữ số đầu tiên sau dấu phẩy thì viết dấu phẩy vào thương.',explain:`${fmt(n)} : ${d} = ${fmt(q)}`})}if(t===1){const [n,d]=pick([[7,4],[9,4],[3,4],[13,5],[17,4],[21,8],[11,2],[27,4],[3,8]]);return eq(`${n} : ${d} = ?`,{answer:n/d,hint:'Chia như bình thường. Còn dư thì viết dấu phẩy vào thương, thêm chữ số 0 vào số dư rồi chia tiếp.',explain:`${n} : ${d} = ${fmt(n/d)}`})}const b=R(11,49)/10,k=R(2,9);const a=dec(b*k,1);return eq(`${fmt(a)} : ${fmt(b)} = ?`,{answer:k,hint:'Chuyển dấu phẩy của số chia và số bị chia sang phải cùng một số chữ số để số chia là số tự nhiên, rồi chia.',explain:`${fmt(a)} : ${fmt(b)} = ${fmt(a*10)} : ${fmt(b*10)} = ${k}`})};
SK.l5_stp10=()=>{const a=R(101,99999)/100;const [op,k,p]=pick([['×',10,1],['×',100,2],[':',10,-1],[':',100,-2],['×',0.1,-1],['×',0.01,-2],[':',0.1,1]]);const r=dec(a*Math.pow(10,p),4);return eq(`${fmt(a)} ${op} ${fmt(k)} = ?`,{answer:r,hint:`Chỉ cần chuyển dấu phẩy sang ${p>0?'phải':'trái'} ${Math.abs(p)} chữ số.`,explain:`${fmt(a)} ${op} ${fmt(k)} = ${fmt(r)}`})};
SK.l5_dt_tamgiac=()=>{const a=R(2,15)*2,h=R(3,20);return {text:`Hình tam giác có độ dài đáy ${a} cm, chiều cao ${h} cm. Tính diện tích hình tam giác.`,unit:'cm²',answer:a*h/2,hint:'Diện tích hình tam giác = độ dài đáy × chiều cao : 2.',explain:`${a} × ${h} : 2 = ${a*h/2} (cm²)`}};
SK.l5_dt_thang=()=>{let a,b,h;do{a=R(6,20);b=R(3,a-1);h=R(2,12)}while(((a+b)*h)%2);return {text:`Hình thang có độ dài hai đáy là ${a} cm và ${b} cm, chiều cao ${h} cm. Tính diện tích hình thang.`,unit:'cm²',answer:(a+b)*h/2,hint:'Diện tích hình thang = (đáy lớn + đáy bé) × chiều cao : 2.',explain:`(${a} + ${b}) × ${h} : 2 = ${(a+b)*h/2} (cm²)`}};
SK.l5_tron=()=>{const r=R(1,10),t=R(0,2);if(t===0)return {text:`Hình tròn có đường kính ${2*r} cm. Tính chu vi hình tròn (lấy π = 3,14).`,unit:'cm',answer:dec(2*r*3.14,2),hint:'Chu vi hình tròn = đường kính × 3,14.',explain:`${2*r} × 3,14 = ${fmt(dec(2*r*3.14,2))} (cm)`};if(t===1)return {text:`Hình tròn có bán kính ${r} cm. Tính chu vi hình tròn (lấy π = 3,14).`,unit:'cm',answer:dec(2*r*3.14,2),hint:'Chu vi hình tròn = bán kính × 2 × 3,14.',explain:`${r} × 2 × 3,14 = ${fmt(dec(2*r*3.14,2))} (cm)`};return {text:`Hình tròn có bán kính ${r} cm. Tính diện tích hình tròn (lấy π = 3,14).`,unit:'cm²',answer:dec(r*r*3.14,2),hint:'Diện tích hình tròn = bán kính × bán kính × 3,14.',explain:`${r} × ${r} × 3,14 = ${fmt(dec(r*r*3.14,2))} (cm²)`}};
SK.l5_on_stp=()=>pick([SK.l5_stp_kn,SK.l5_ss_stp,SK.l5_viet_stp,SK.l5_lamtron_stp])();
SK.l5_tiso=()=>{if(Math.random()<.5){const a=R(1,9),b=R(2,9);return fq(`Tỉ số của ${a} và ${b} viết dưới dạng phân số là:`,`Tỉ số của ${a} và ${b} viết dưới dạng phân số`,[a,b],{hint:`Tỉ số của a và b là a : b, viết thành phân số a/b.`,explain:`Tỉ số của ${a} và ${b} là ${a} : ${b} = ${a}/${b}.`})}const [a,b]=pick([[1,4],[1,2],[3,4],[1,5],[2,5],[3,10],[7,20],[9,25],[1,20]]);return {html:`Viết ${F(a,b)} dưới dạng tỉ số phần trăm.`,speak:`Viết ${fracTxt(a,b)} dưới dạng tỉ số phần trăm`,unit:'%',answer:a*100/b,hint:'Viết phân số có mẫu số 100, tử số chính là số phần trăm.',explain:`${a}/${b} = ${a*100/b}/100 = ${a*100/b}%`}};
SK.l5_tilebd=()=>{const k=pick([1000,2000,5000,10000,100000,500000]),c=R(2,9);const real=c*k;const [val,u]=real>=100000?[real/100000,'km']:[real/100,'m'];return {text:`Bản đồ có tỉ lệ <b>1 : ${fmt(k)}</b>. Một đoạn thẳng trên bản đồ dài ${c} cm. Độ dài thật của đoạn đó là bao nhiêu ${u==='km'?'ki-lô-mét':'mét'}?`,unit:u,answer:val,hint:`1 cm trên bản đồ ứng với ${fmt(k)} cm ngoài thực tế. Tính ra xăng-ti-mét rồi đổi sang ${u}.`,explain:`${c} × ${fmt(k)} = ${fmt(real)} (cm) = ${fmt(val)} ${u}.`}};
SK.l5_tongti=()=>{const a=R(1,5),b=R(a+1,9),u=R(3,30);const S=(a+b)*u;const big=Math.random()<.5;return {html:`Tổng của hai số là ${S}. Tỉ số của số bé và số lớn là ${F(a,b)}. Tìm số ${big?'lớn':'bé'}.`,speak:`Tổng hai số là ${S}, tỉ số của số bé và số lớn là ${fracTxt(a,b)}. Tìm số ${big?'lớn':'bé'}.`,answer:big?b*u:a*u,hint:`Vẽ sơ đồ: số bé ${a} phần, số lớn ${b} phần. Tìm giá trị một phần bằng tổng chia cho ${a+b}.`,explain:`Tổng số phần: ${a} + ${b} = ${a+b}. Một phần: ${S} : ${a+b} = ${u}. Số ${big?'lớn':'bé'}: ${u} × ${big?b:a} = ${big?b*u:a*u}.`}};
SK.l5_hieuti=()=>{const a=R(1,6),b=R(a+1,9),u=R(3,30);const D=(b-a)*u;const big=Math.random()<.5;return {html:`Hiệu của hai số là ${D}. Tỉ số của số bé và số lớn là ${F(a,b)}. Tìm số ${big?'lớn':'bé'}.`,speak:`Hiệu hai số là ${D}, tỉ số của số bé và số lớn là ${fracTxt(a,b)}. Tìm số ${big?'lớn':'bé'}.`,answer:big?b*u:a*u,hint:`Vẽ sơ đồ: số bé ${a} phần, số lớn ${b} phần. Hiệu số phần là ${b-a}. Một phần bằng hiệu chia cho ${b-a}.`,explain:`Hiệu số phần: ${b} − ${a} = ${b-a}. Một phần: ${D} : ${b-a} = ${u}. Số ${big?'lớn':'bé'}: ${u} × ${big?b:a} = ${big?b*u:a*u}.`}};
SK.l5_tisopt=()=>{const b=pick([20,25,40,50]),a=R(1,b-1),v=a/b*100;return {text:`Tìm tỉ số phần trăm của ${a} và ${b}.`,unit:'%',answer:v,hint:`Lấy ${a} chia cho ${b}, rồi nhân thương với 100 và viết thêm kí hiệu %.`,explain:`${a} : ${b} = ${fmt(a/b)}; ${fmt(a/b)} × 100 = ${fmt(v)}%`}};
SK.l5_giatript=()=>{const P=[5,10,15,20,25,30,40,50,75];if(Math.random()<.5){const p=pick(P),n=20*R(1,25);return {text:`Tìm ${p}% của ${n}.`,speak:`Tìm ${p} phần trăm của ${n}`,answer:n*p/100,hint:`Lấy ${n} chia cho 100 rồi nhân với ${p}.`,explain:`${n} : 100 × ${p} = ${fmt(n*p/100)}`}}let N,p;do{N=pick([20,30,40,50]);p=pick(P)}while(N*p%100);return {text:`Một lớp có ${N} học sinh, trong đó ${p}% là học sinh nữ. Hỏi lớp đó có bao nhiêu học sinh nữ?`,unit:'học sinh',answer:N*p/100,hint:`Tìm ${p}% của ${N}: lấy ${N} : 100 × ${p}.`,explain:`${N} : 100 × ${p} = ${N*p/100} (học sinh)`}};
SK.l5_tt_dem=()=>{const x=R(2,5),y=R(2,5),z=R(2,4);return {text:`Một hình hộp chữ nhật được xếp từ các hình lập phương nhỏ có thể tích 1 cm³: mỗi lớp có ${x} hàng, mỗi hàng ${y} hình, xếp ${z} lớp. Thể tích hình hộp đó là bao nhiêu?`,unit:'cm³',answer:x*y*z,hint:'Tìm số hình lập phương nhỏ ở một lớp, rồi nhân với số lớp.',explain:`${x} × ${y} = ${x*y} (hình mỗi lớp); ${x*y} × ${z} = ${x*y*z} (cm³)`}};
SK.l5_dvtt=()=>{const [big,sm,k]=pick([['dm³','cm³',1000],['m³','dm³',1000],['l','dm³',1]]);const x=R(2,9);if(k===1)return {text:'1 lít bằng bao nhiêu đề-xi-mét khối?',unit:'dm³',answer:1,hint:'Một hình lập phương cạnh 1 dm chứa vừa đúng 1 lít nước.',explain:'1 l = 1 dm³.'};return eq(`${x} ${big} = ? ${sm}`,{speak:`${x} ${big.replace('³',' khối')} bằng bao nhiêu ${sm.replace('³',' khối')}?`,unit:sm,answer:x*k,hint:`1 ${big} = ${fmt(k)} ${sm}.`,explain:`${x} ${big} = ${fmt(x*k)} ${sm}.`})};
SK.l5_hhcn=()=>{const a=R(4,12),b=R(2,a-1),h=R(2,10);const sxq=(a+b)*2*h,stp=sxq+2*a*b;const tp=Math.random()<.5;return {text:`Hình hộp chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm, chiều cao ${h} cm. Tính diện tích ${tp?'toàn phần':'xung quanh'}.`,unit:'cm²',answer:tp?stp:sxq,hint:tp?'Diện tích toàn phần = diện tích xung quanh + diện tích hai đáy.':'Diện tích xung quanh = chu vi đáy × chiều cao.',explain:`Sxq = (${a} + ${b}) × 2 × ${h} = ${sxq} (cm²)${tp?`. Stp = ${sxq} + ${a} × ${b} × 2 = ${stp} (cm²)`:''}.`}};
SK.l5_lp=()=>{const a=R(2,12);const tp=Math.random()<.5;return {text:`Hình lập phương có cạnh ${a} cm. Tính diện tích ${tp?'toàn phần':'xung quanh'}.`,unit:'cm²',answer:a*a*(tp?6:4),hint:tp?'Diện tích toàn phần = diện tích một mặt × 6.':'Diện tích xung quanh = diện tích một mặt × 4.',explain:`${a} × ${a} × ${tp?6:4} = ${a*a*(tp?6:4)} (cm²)`}};
SK.l5_v_hhcn=()=>{const a=R(3,12),b=R(2,a),h=R(2,10);return {text:`Hình hộp chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm, chiều cao ${h} cm. Tính thể tích.`,unit:'cm³',answer:a*b*h,hint:'Thể tích hình hộp chữ nhật = chiều dài × chiều rộng × chiều cao (cùng đơn vị).',explain:`${a} × ${b} × ${h} = ${a*b*h} (cm³)`}};
SK.l5_v_lp=()=>{const a=R(2,12);return {text:`Hình lập phương có cạnh ${a} cm. Tính thể tích.`,unit:'cm³',answer:a*a*a,hint:'Thể tích hình lập phương = cạnh × cạnh × cạnh.',explain:`${a} × ${a} × ${a} = ${a*a*a} (cm³)`}};
SK.l5_dvtg=()=>pick([{text:'1 thế kỉ bằng bao nhiêu năm?',unit:'năm',answer:100,hint:'Thế kỉ là đơn vị rất dài.',explain:'1 thế kỉ = 100 năm.'},{text:'Năm không nhuận có bao nhiêu ngày?',unit:'ngày',answer:365,hint:'Năm nhuận có 366 ngày, năm không nhuận ít hơn 1 ngày.',explain:'Năm không nhuận có 365 ngày.'},(()=>{const k=R(2,5);return {text:`${k} ngày bằng bao nhiêu giờ?`,unit:'giờ',answer:k*24,hint:'1 ngày = 24 giờ.',explain:`${k} × 24 = ${k*24} (giờ)`}})(),(()=>{const h=pick([0.5,1.5,2.5,0.25,0.75,1.25,3.5]);return eq(`${fmt(h)} giờ = ? phút`,{speak:`${fmt(h)} giờ bằng bao nhiêu phút?`,unit:'phút',answer:h*60,hint:'1 giờ = 60 phút. Lấy số giờ nhân với 60.',explain:`${fmt(h)} × 60 = ${h*60} (phút)`})})(),(()=>{const k=R(2,4);return {text:`${k} năm bằng bao nhiêu tháng?`,unit:'tháng',answer:12*k,hint:'1 năm = 12 tháng.',explain:`${k} × 12 = ${12*k} (tháng)`}})()]);
const gp=(h,m)=>`${h} giờ ${m} phút`;
const tgChoice=(text,H,M,hint,explain)=>{const a=gp(H,M);const w=[gp(H+1,M),gp(H,(M+10)%60),gp(H-1>0?H-1:H+2,M)].filter(x=>x!==a);return ch(text,a,[...new Set(w)],{hint,explain})};
SK.l5_tg_congtru=()=>{const h1=R(1,5),m1=R(10,55),h2=R(1,4),m2=R(10,55);if(Math.random()<.5){let H=h1+h2,M=m1+m2;const carry=M>=60;if(carry){M-=60;H++}return tgChoice(`${gp(h1,m1)} + ${gp(h2,m2)} = ?`,H,M,'Cộng giờ với giờ, phút với phút. Phút được 60 trở lên thì đổi 60 phút thành 1 giờ.',`${h1+h2} giờ ${m1+m2} phút${carry?` = ${H} giờ ${M} phút`:''}.`)}let A=h1+h2+2,B=h2;let tot=(A*60+m1)-(B*60+m2);const H=Math.floor(tot/60),M=tot%60;return tgChoice(`${gp(A,m1)} − ${gp(B,m2)} = ?`,H,M,'Trừ giờ với giờ, phút với phút. Phút không đủ trừ thì đổi 1 giờ thành 60 phút.',`${gp(A,m1)} − ${gp(B,m2)} = ${gp(H,M)}.`)};
SK.l5_tg_nhanchia=()=>{if(Math.random()<.5){const h=R(1,3),m=R(5,40),k=R(2,4);const tot=(h*60+m)*k;return tgChoice(`${gp(h,m)} × ${k} = ?`,Math.floor(tot/60),tot%60,'Nhân lần lượt số giờ và số phút với số đó, rồi đổi phút thành giờ nếu được 60 phút trở lên.',`${h*k} giờ ${m*k} phút = ${gp(Math.floor(tot/60),tot%60)}.`)}const k=R(2,4),H=R(1,3),M=R(1,11)*5;const tot=(H*60+M)*k;return tgChoice(`${gp(Math.floor(tot/60),tot%60)} : ${k} = ?`,H,M,'Chia số giờ trước. Giờ còn dư thì đổi ra phút, cộng với số phút rồi chia tiếp.',`${gp(Math.floor(tot/60),tot%60)} : ${k} = ${gp(H,M)}.`)};
SK.l5_vantoc=()=>{const v=R(4,60),t=R(2,5);const [who,u]=pick([['Một ô tô','km'],['Một xe đạp','km'],['Một người đi bộ','km']]);const vv=who==='Một người đi bộ'?R(3,6):who==='Một xe đạp'?R(10,18):R(35,60);return {text:`${who} đi được ${vv*t} km trong ${t} giờ. Tính vận tốc.`,unit:'km/giờ',answer:vv,hint:'Vận tốc = quãng đường : thời gian.',explain:`${vv*t} : ${t} = ${vv} (km/giờ)`}};
SK.l5_quangduong=()=>{const v=R(30,60),t=R(2,5);if(Math.random()<.5)return {text:`Một ô tô đi với vận tốc ${v} km/giờ trong ${t} giờ. Tính quãng đường ô tô đi được.`,unit:'km',answer:v*t,hint:'Quãng đường = vận tốc × thời gian.',explain:`${v} × ${t} = ${v*t} (km)`};return {text:`Một ô tô đi quãng đường ${v*t} km với vận tốc ${v} km/giờ. Tính thời gian ô tô đi hết quãng đường đó.`,unit:'giờ',answer:t,hint:'Thời gian = quãng đường : vận tốc.',explain:`${v*t} : ${v} = ${t} (giờ)`}};
SK.l5_quat=()=>{const parts=pick([[['Bóng đá',40],['Cầu lông',25],['Bơi',20],['Cờ vua',15]],[['Đọc sách',35],['Vẽ',25],['Hát',30],['Khác',10]],[['Toán',45],['Tiếng Việt',30],['Tiếng Anh',25]]]);const N=pick([20,40,60,80,100,200]);const i=R(0,parts.length-1);return {text:`Biểu đồ hình quạt tròn cho biết sở thích của ${N} học sinh. Có bao nhiêu học sinh chọn <b>${parts[i][0]}</b>?`,fig:pieSVG(parts),unit:'học sinh',answer:N*parts[i][1]/100,hint:`Tìm ${parts[i][1]}% của ${N}: lấy ${N} : 100 × ${parts[i][1]}.`,explain:`${N} : 100 × ${parts[i][1]} = ${N*parts[i][1]/100} (học sinh)`}};

const TONES={'̀':'huyền','́':'sắc','̉':'hỏi','̃':'ngã','̣':'nặng'};
const ONSETS=['ngh','gh','ng','nh','ch','tr','th','ph','kh','gi','qu','b','c','d','đ','g','h','k','l','m','n','p','r','s','t','v','x'];
function tieng(w){const nfd=w.normalize('NFD');let thanh='ngang',base='';for(const c of nfd){if(TONES[c])thanh=TONES[c];else base+=c}base=base.normalize('NFC');let dau='';for(const o of ONSETS)if(base.startsWith(o)&&base.length>o.length){dau=o;break}return {dau,van:base.slice(dau.length),thanh,base}}

const VAN_LIST=[...new Set(W1.map(w=>tieng(w).van))];
SK.tv1_amdau=()=>{const w=pick(W1.filter(x=>tieng(x).dau));const t=tieng(w);const opts=shuffle(ONSETS.filter(o=>o!==t.dau&&!['k','q'].includes(o))).slice(0,3);return ch(`Tiếng “<b>${w}</b>” bắt đầu bằng âm nào?`,t.dau,opts,{hint:'Đọc chậm tiếng đó. Âm đứng đầu tiếng là âm đầu.',explain:`“${w}” = ${t.dau} + ${t.van}${t.thanh!=='ngang'?' + dấu '+t.thanh:''}.`})};
SK.tv1_van=()=>{const w=pick(W1.filter(x=>tieng(x).dau));const t=tieng(w);const opts=shuffle(VAN_LIST.filter(v=>v!==t.van)).slice(0,3);return ch(`Tiếng “<b>${w}</b>” có vần gì?`,t.van,opts,{hint:'Bỏ âm đầu và dấu thanh đi, phần còn lại là vần.',explain:`“${w}” = ${t.dau} + ${t.van}: vần ${t.van}.`})};

SK.tv1_thanh=()=>{const w=pick(W1);const t=tieng(w);const lbl=x=>x==='ngang'?'Thanh ngang (không dấu)':'Dấu '+x;return ch(`Tiếng “<b>${w}</b>” có dấu thanh gì?`,lbl(t.thanh),shuffle(THANH.filter(x=>x!==t.thanh)).slice(0,3).map(lbl),{hint:'Nhìn kĩ dấu nằm trên hoặc dưới chữ cái: huyền (`), sắc (´), hỏi (?), ngã (~), nặng (.).',explain:`Tiếng “${w}” có ${lbl(t.thanh).toLowerCase()}.`})};
SK.tv1_ghep=()=>{const w=pick(W1.filter(x=>tieng(x).dau));const t=tieng(w);const others=shuffle(W1.filter(x=>x!==w&&(tieng(x).dau===t.dau||tieng(x).van===t.van))).slice(0,3);while(others.length<3){const o=pick(W1);if(o!==w&&!others.includes(o))others.push(o)}return ch(`Ghép: <b>${t.dau} + ${t.van}${t.thanh!=='ngang'?' + dấu '+t.thanh:''}</b> thành tiếng nào?`,w,others,{hint:'Đọc âm đầu, nối với vần, rồi thêm dấu thanh.',explain:`${t.dau} + ${t.van}${t.thanh!=='ngang'?' + dấu '+t.thanh:''} = ${w}.`})};

cb('tv3_sosanh','Hình ảnh so sánh thường có các từ: như, giống như, tựa như, là…',[['Câu nào có hình ảnh so sánh?','Mặt trăng tròn như cái đĩa bạc.',['Mặt trăng đã lên cao.','Đêm nay trời có trăng.','Em ngắm trăng cùng bà.']],['Câu nào có hình ảnh so sánh?','Đôi mắt bé sáng như sao.',['Bé mở mắt nhìn mẹ.','Bé đã ngủ say.','Mắt bé màu đen.']],['Câu nào có hình ảnh so sánh?','Dòng sông uốn quanh như dải lụa mềm.',['Dòng sông chảy qua làng.','Em đi tắm sông.','Nước sông rất mát.']],['Câu nào có hình ảnh so sánh?','Ông em hiền như ông Bụt.',['Ông em năm nay bảy mươi tuổi.','Ông em thích trồng cây.','Ông em đi tập thể dục.']],['Câu nào có hình ảnh so sánh?','Hoa giấy đỏ rực như lửa.',['Hoa giấy nở trước cổng.','Mẹ trồng một cây hoa giấy.','Hoa giấy có nhiều màu.']],['Câu nào có hình ảnh so sánh?','Chú mèo cuộn tròn như một cục bông.',['Chú mèo nằm trên ghế.','Nhà em nuôi một chú mèo.','Chú mèo kêu meo meo.']],['Câu nào có hình ảnh so sánh?','Tán bàng xòe ra giống như chiếc ô xanh.',['Cây bàng ở giữa sân trường.','Lá bàng rụng vào mùa đông.','Chúng em chơi dưới gốc bàng.']],['Câu nào có hình ảnh so sánh?','Cánh đồng lúa chín vàng như một tấm thảm.',['Bác nông dân gặt lúa.','Cánh đồng rất rộng.','Lúa đã chín rồi.']],['Trong câu <b>“Đôi má em bé hồng như quả táo chín.”</b>, đôi má được so sánh với gì?','quả táo chín',['em bé','màu hồng','đôi má'],null,'Tìm từ “như”, phần đứng sau từ “như” là sự vật được đem ra so sánh.'],['Trong câu <b>“Tiếng ve râm ran như một dàn đồng ca.”</b>, tiếng ve được so sánh với gì?','một dàn đồng ca',['tiếng ve','râm ran','mùa hè'],null,'Phần đứng sau từ “như” là sự vật được đem ra so sánh.']],{long:true});

cb('tv3_kieucau','Câu kể dùng để kể, tả, giới thiệu. Câu hỏi dùng để hỏi. Câu cảm bộc lộ cảm xúc. Câu khiến dùng để yêu cầu, đề nghị.',[['<b>Bạn đã làm bài tập chưa?</b> Đây là kiểu câu gì?','Câu hỏi'],['<b>Hôm nay trời nắng đẹp.</b> Đây là kiểu câu gì?','Câu kể'],['<b>Ôi, bức tranh đẹp quá!</b> Đây là kiểu câu gì?','Câu cảm'],['<b>Các em hãy giữ trật tự!</b> Đây là kiểu câu gì?','Câu khiến'],['<b>Ở đâu có nhiều sách hay?</b> Đây là kiểu câu gì?','Câu hỏi'],['<b>Mẹ em là giáo viên.</b> Đây là kiểu câu gì?','Câu kể'],['<b>Chà, con diều bay cao quá!</b> Đây là kiểu câu gì?','Câu cảm'],['<b>Con hãy cất sách vở gọn gàng.</b> Đây là kiểu câu gì?','Câu khiến'],['<b>Đừng vứt rác ra sân trường!</b> Đây là kiểu câu gì?','Câu khiến'],['<b>Đàn cò trắng bay qua cánh đồng.</b> Đây là kiểu câu gì?','Câu kể']].map(x=>[x[0],x[1],[]]),{keep:['Câu kể','Câu hỏi','Câu cảm','Câu khiến']});
cb('tv3_daucau','Dấu hai chấm báo hiệu phần liệt kê hoặc lời nói của nhân vật. Dấu ngoặc kép đánh dấu lời nói trực tiếp hoặc tên riêng được nhắc tới.',[['Câu nào dùng dấu hai chấm đúng?','Vườn nhà em có nhiều loại cây: cam, bưởi, nhãn.',['Vườn nhà em: có nhiều loại cây cam, bưởi, nhãn.','Vườn: nhà em có nhiều loại cây cam, bưởi, nhãn.','Vườn nhà em có nhiều: loại cây cam, bưởi, nhãn.']],['Câu nào dùng dấu câu đúng?','Mẹ dặn: “Con nhớ mặc áo ấm nhé!”',['Mẹ dặn “Con nhớ: mặc áo ấm nhé!”','Mẹ: dặn “Con nhớ mặc áo ấm nhé!”','Mẹ dặn, “Con nhớ mặc áo ấm nhé”:']],['Dấu hai chấm trong câu <b>“Trên bàn có: sách, vở, bút.”</b> dùng để làm gì?','Báo hiệu phần liệt kê',['Báo hiệu lời nói của nhân vật','Kết thúc câu','Ngăn cách hai câu']],['Dấu ngoặc kép trong câu <b>Bố bảo: “Con giỏi lắm!”</b> dùng để làm gì?','Đánh dấu lời nói trực tiếp',['Báo hiệu phần liệt kê','Kết thúc câu hỏi','Ngăn cách các từ cùng loại']],['Câu nào dùng dấu câu đúng?','Em thích đọc truyện “Dế Mèn phiêu lưu kí”.',['Em thích đọc truyện: Dế Mèn phiêu lưu kí.','Em thích đọc: truyện “Dế Mèn” phiêu lưu kí.','Em “thích” đọc truyện Dế Mèn phiêu lưu kí.']],['Câu nào dùng dấu hai chấm đúng?','Lớp em có ba tổ: tổ Một, tổ Hai, tổ Ba.',['Lớp em: có ba tổ tổ Một, tổ Hai, tổ Ba.','Lớp: em có ba tổ, tổ Một, tổ Hai, tổ Ba.','Lớp em có: ba tổ tổ Một tổ Hai tổ Ba.']]],{long:true});
rd('tv3_doc',[
 {t:'Ngày hội đọc sách',p:'Trường em tổ chức Ngày hội đọc sách. Sân trường rực rỡ cờ hoa. Mỗi lớp trưng bày một gian sách do các bạn tự trang trí. Lớp 3A dựng một con thuyền bằng bìa, trên thuyền xếp đầy truyện cổ tích. Em được giới thiệu cuốn truyện mình yêu thích với các bạn lớp khác. Em mong năm nào trường cũng có ngày hội như thế.',q:[['Trường em tổ chức hoạt động gì?','Ngày hội đọc sách',['Hội khỏe Phù Đổng','Văn nghệ chào mừng','Trồng cây đầu xuân']],['Lớp 3A trang trí gian sách thế nào?','Dựng con thuyền bằng bìa, xếp đầy truyện cổ tích',['Treo nhiều bóng bay','Vẽ tranh lên tường','Trải thảm hoa trước gian']],['Câu “Sân trường rực rỡ cờ hoa.” thuộc kiểu câu nào?','Câu kể',['Câu hỏi','Câu cảm','Câu khiến']],['Em mong điều gì?','Năm nào trường cũng có ngày hội như thế',['Được tặng nhiều sách','Được nghỉ học','Lớp em được giải nhất']]]},
 {t:'Chú sẻ và bông cúc',p:'Trong khu vườn nhỏ, có một bông cúc mọc bên hàng rào. Mấy hôm trời nắng gắt, đất khô nứt nẻ, bông cúc héo rũ. Chú chim sẻ thấy vậy liền bay ra bờ suối, ngậm từng giọt nước về tưới cho hoa. Sáng hôm sau, bông cúc tươi tỉnh trở lại, nở những cánh hoa vàng rực.',q:[['Vì sao bông cúc héo rũ?','Vì trời nắng gắt, đất khô nứt nẻ',['Vì bị sâu ăn lá','Vì có người hái mất','Vì trời mưa to quá']],['Chim sẻ đã làm gì để giúp bông cúc?','Ngậm từng giọt nước về tưới cho hoa',['Hót cho hoa nghe','Che nắng cho hoa','Nhổ cỏ quanh hoa']],['Câu chuyện khuyên em điều gì?','Biết giúp đỡ người khác khi gặp khó khăn',['Không nên ra vườn khi trời nắng','Phải tưới cây mỗi ngày','Chim sẻ thích ở bờ suối']]]},
 {t:'Phiên chợ quê',p:'Mỗi tháng, quê ngoại em có sáu phiên chợ. Từ sáng sớm, người các xóm đã gánh hàng ra chợ: nào rau cải xanh mướt, nào gà vịt kêu inh ỏi, nào những thúng cam vàng óng. Tiếng mời chào, tiếng cười nói rộn ràng cả một góc làng. Em thích nhất hàng bánh đúc của bà cụ đầu chợ, bánh nóng hổi, thơm mùi lá chuối.',q:[['Mỗi tháng, quê ngoại em có mấy phiên chợ?','Sáu phiên',['Một phiên','Ba phiên','Mười phiên']],['Từ ngữ nào tả những thúng cam?','vàng óng',['xanh mướt','inh ỏi','nóng hổi']],['Em thích nhất hàng nào?','Hàng bánh đúc của bà cụ đầu chợ',['Hàng rau cải','Hàng gà vịt','Hàng cam']],['Dấu hai chấm trong câu thứ hai dùng để làm gì?','Báo hiệu phần liệt kê',['Báo hiệu lời nói của nhân vật','Kết thúc câu','Ngăn cách hai câu']]]},

cb('tv4_dongtu','Động từ là từ chỉ hoạt động, trạng thái của người, sự vật.',[['Tìm động từ trong câu: <b>Bà em tưới rau ngoài vườn.</b>','tưới',['bà','rau','vườn']],['Tìm động từ trong câu: <b>Đàn cá bơi tung tăng dưới hồ.</b>','bơi',['đàn cá','tung tăng','hồ']],['Tìm động từ trong câu: <b>Các bạn học sinh trồng cây ở sân trường.</b>','trồng',['học sinh','cây','sân trường']],['Tìm động từ trong câu: <b>Mẹ em may áo mới.</b>','may',['mẹ','áo','mới']],['Tìm động từ trong câu: <b>Em bé ngủ say trong nôi.</b>','ngủ',['em bé','say','nôi']],['Tìm động từ trong câu: <b>Chú chim hót líu lo trên cành.</b>','hót',['chú chim','líu lo','cành']],['Từ nào là động từ?','suy nghĩ',['ngôi nhà','xinh đẹp','bông hoa']],['Từ nào là động từ?','lắng nghe',['cô giáo','dịu dàng','bài hát']]]);
cb('tv4_tinhtu','Tính từ là từ chỉ đặc điểm, tính chất của sự vật, hoạt động, trạng thái (màu sắc, hình dáng, kích thước, phẩm chất…).',[['Tìm tính từ trong câu: <b>Bầu trời mùa thu trong xanh.</b>','trong xanh',['bầu trời','mùa thu','trời']],['Tìm tính từ trong câu: <b>Bạn Lan rất chăm chỉ.</b>','chăm chỉ',['bạn Lan','rất','bạn']],['Tìm tính từ trong câu: <b>Con đường làng nhỏ và quanh co.</b>','quanh co',['con đường','làng','và']],['Tìm tính từ trong câu: <b>Những quả cam chín mọng.</b>','chín mọng',['quả cam','những','quả']],['Tìm tính từ trong câu: <b>Cô giáo em rất hiền.</b>','hiền',['cô giáo','em','rất']],['Từ nào là tính từ?','thông minh',['học bài','cái bàn','nhảy dây']],['Từ nào là tính từ?','đỏ thắm',['bông hoa','nở','mùa xuân']],['Từ nào là tính từ?','rộng lớn',['cánh đồng','gặt lúa','nông dân']]]);
cb('tv4_tuloai','Danh từ chỉ sự vật. Động từ chỉ hoạt động, trạng thái. Tính từ chỉ đặc điểm, tính chất.',[['Từ <b>“học sinh”</b> thuộc từ loại nào?','Danh từ'],['Từ <b>“dòng sông”</b> thuộc từ loại nào?','Danh từ'],['Từ <b>“bút chì”</b> thuộc từ loại nào?','Danh từ'],['Từ <b>“nhảy”</b> thuộc từ loại nào?','Động từ'],['Từ <b>“trồng”</b> thuộc từ loại nào?','Động từ'],['Từ <b>“bơi”</b> thuộc từ loại nào?','Động từ'],['Từ <b>“lắng nghe”</b> thuộc từ loại nào?','Động từ'],['Từ <b>“thông minh”</b> thuộc từ loại nào?','Tính từ'],['Từ <b>“đỏ thắm”</b> thuộc từ loại nào?','Tính từ'],['Từ <b>“hiền lành”</b> thuộc từ loại nào?','Tính từ'],['Từ <b>“cánh đồng”</b> thuộc từ loại nào?','Danh từ'],['Từ <b>“rộng lớn”</b> thuộc từ loại nào?','Tính từ']].map(x=>[x[0],x[1],[]]),{keep:['Danh từ','Động từ','Tính từ']});
cb('tv4_nhanhoa','Nhân hóa là gọi hoặc tả sự vật, con vật bằng những từ ngữ dùng cho người (chị, ông, cô; ru, chào, ngóng chờ, hát…).',[['Câu nào có sử dụng biện pháp nhân hóa?','Chị gió nhẹ nhàng ru lá ngủ.',['Gió thổi mạnh làm lá rụng.','Hôm nay trời nhiều gió.','Gió mang hơi lạnh về.']],['Câu nào có sử dụng biện pháp nhân hóa?','Ông mặt trời thức dậy, vươn vai chào buổi sáng.',['Mặt trời mọc ở đằng đông.','Nắng chiếu vào sân nhà.','Buổi sáng trời nắng nhẹ.']],['Câu nào có sử dụng biện pháp nhân hóa?','Chú gà trống hắng giọng gọi cả xóm dậy.',['Nhà em nuôi một con gà trống.','Gà trống có bộ lông đỏ.','Gà trống đứng trên đống rơm.']],['Câu nào có sử dụng biện pháp nhân hóa?','Hàng cây nghiêng mình chào đón chúng em.',['Hàng cây xanh tốt quanh năm.','Sân trường có nhiều cây.','Bác bảo vệ tưới cây.']],['Câu nào có sử dụng biện pháp nhân hóa?','Chiếc cặp sách nằm im, ngóng chờ em đến lớp.',['Chiếc cặp sách màu xanh.','Mẹ mua cho em chiếc cặp mới.','Em cất sách vào cặp.']],['Câu nào có sử dụng biện pháp nhân hóa?','Cô mây trắng rong chơi khắp bầu trời.',['Trên trời có nhiều mây.','Mây trắng bay qua núi.','Trời nhiều mây nên mát.']],['Câu nào có sử dụng biện pháp nhân hóa?','Dòng suối hát róc rách bên sườn đồi.',['Dòng suối chảy qua bản.','Nước suối rất trong.','Em rửa tay ở suối.']],['Trong câu <b>“Bác xe lu cần mẫn làm việc suốt ngày.”</b>, sự vật nào được nhân hóa?','xe lu',['con đường','ngày','công nhân'],null,'Tìm sự vật được gọi hoặc tả bằng từ ngữ dùng cho người (bác, cần mẫn, làm việc).']],{long:true});
cb('tv4_cnvn','Chủ ngữ trả lời câu hỏi “Ai?”, “Cái gì?”, “Con gì?”. Vị ngữ trả lời câu hỏi “Làm gì?”, “Thế nào?”, “Là gì?”.',[['Chủ ngữ của câu <b>“Đàn chim én bay lượn trên bầu trời.”</b> là:','Đàn chim én',['bay lượn','trên bầu trời','bầu trời']],['Chủ ngữ của câu <b>“Những bông hoa phượng đỏ rực cả góc sân.”</b> là:','Những bông hoa phượng',['đỏ rực','cả góc sân','góc sân']],['Chủ ngữ của câu <b>“Bác nông dân đang gặt lúa ngoài đồng.”</b> là:','Bác nông dân',['đang gặt lúa','ngoài đồng','lúa']],['Vị ngữ của câu <b>“Cô giáo em giảng bài rất hay.”</b> là:','giảng bài rất hay',['Cô giáo em','Cô giáo','rất hay']],['Vị ngữ của câu <b>“Dòng sông quê em hiền hòa.”</b> là:','hiền hòa',['Dòng sông','Dòng sông quê em','quê em']],['Vị ngữ của câu <b>“Mẹ em là bác sĩ.”</b> là:','là bác sĩ',['Mẹ em','bác sĩ','Mẹ']],['Chủ ngữ của câu <b>“Tiếng trống trường vang lên giòn giã.”</b> là:','Tiếng trống trường',['vang lên','giòn giã','trường']],['Vị ngữ của câu <b>“Đàn trâu thong thả gặm cỏ bên đê.”</b> là:','thong thả gặm cỏ bên đê',['Đàn trâu','bên đê','gặm cỏ']]],{long:true});
cb('tv4_trangngu','Trạng ngữ thường đứng đầu câu, ngăn cách với chủ ngữ bằng dấu phẩy. Hỏi “Khi nào?” → thời gian; “Ở đâu?” → nơi chốn; “Vì sao?” → nguyên nhân; “Để làm gì?” → mục đích.',[['Trong câu <b>“Sáng sớm, bà em đã ra vườn.”</b>, trạng ngữ chỉ gì?','Thời gian'],['Trong câu <b>“Trên cành cây, chim hót líu lo.”</b>, trạng ngữ chỉ gì?','Nơi chốn'],['Trong câu <b>“Vì trời mưa, buổi cắm trại bị hoãn lại.”</b>, trạng ngữ chỉ gì?','Nguyên nhân'],['Trong câu <b>“Để đạt điểm cao, Nam chăm chỉ ôn bài.”</b>, trạng ngữ chỉ gì?','Mục đích'],['Trong câu <b>“Mùa hè, hoa phượng nở đỏ rực.”</b>, trạng ngữ chỉ gì?','Thời gian'],['Trong câu <b>“Ngoài đồng, các bác nông dân đang gặt lúa.”</b>, trạng ngữ chỉ gì?','Nơi chốn'],['Trong câu <b>“Nhờ chăm chỉ luyện tập, Lan đã tiến bộ.”</b>, trạng ngữ chỉ gì?','Nguyên nhân'],['Trong câu <b>“Để bảo vệ môi trường, chúng em trồng thêm cây xanh.”</b>, trạng ngữ chỉ gì?','Mục đích'],['Trong câu <b>“Tối qua, cả nhà em xem phim.”</b>, trạng ngữ chỉ gì?','Thời gian'],['Trong câu <b>“Dưới gốc đa, mấy em bé đang chơi chuyền.”</b>, trạng ngữ chỉ gì?','Nơi chốn']].map(x=>[x[0],x[1],[]]),{keep:['Thời gian','Nơi chốn','Nguyên nhân','Mục đích']});
cb('tv4_daucau','Dấu gạch ngang đặt ở đầu dòng để đánh dấu lời nói của nhân vật trong đối thoại, hoặc đánh dấu các ý liệt kê. Dấu ngoặc đơn đánh dấu phần chú thích.',[['Dấu gạch ngang trong đoạn <b>“– Cháu chào bà ạ! – Ừ, cháu ngoan quá!”</b> dùng để làm gì?','Đánh dấu lời nói của nhân vật',['Đánh dấu phần chú thích','Kết thúc câu','Báo hiệu câu hỏi']],['Dấu ngoặc đơn trong câu <b>“Phở (món ăn truyền thống của Hà Nội) rất ngon.”</b> dùng để làm gì?','Đánh dấu phần chú thích',['Đánh dấu lời nói của nhân vật','Liệt kê các sự vật','Kết thúc câu']],['Câu nào dùng dấu ngoặc đơn đúng?','Hà Nội (thủ đô của nước ta) có nhiều cảnh đẹp.',['Hà Nội thủ đô (của nước ta) có nhiều cảnh đẹp.','(Hà Nội) thủ đô của nước ta có nhiều cảnh đẹp.','Hà Nội thủ đô của nước ta có nhiều (cảnh đẹp).']],['Dấu gạch ngang trong đoạn sau dùng để làm gì?<br><b>Mang theo khi đi dã ngoại:<br>– nước uống<br>– mũ nón<br>– áo mưa</b>','Đánh dấu các ý liệt kê',['Đánh dấu lời nói của nhân vật','Đánh dấu phần chú thích','Nối các từ trong một liên danh']],['Câu nào có dấu ngoặc kép đánh dấu lời nói trực tiếp?','Cô giáo nói: “Các em làm bài rất tốt.”',['Em đọc truyện “Cây khế”.','Lan là “cây văn nghệ” của lớp.','Bạn ấy thích “ăn” sách.']]],{long:true});
cb('tv4_viethoa','Tên cơ quan, tổ chức: viết hoa chữ cái đầu của bộ phận tạo thành tên đó. Tên người, tên địa lí: viết hoa chữ cái đầu mỗi tiếng.',[['Cách viết nào đúng?','Trường Tiểu học Kim Đồng',['trường tiểu học Kim Đồng','Trường tiểu học kim đồng','Trường Tiểu Học kim Đồng']],['Cách viết nào đúng?','Bộ Giáo dục và Đào tạo',['bộ giáo dục và đào tạo','Bộ giáo dục và đào tạo','Bộ Giáo Dục Và Đào Tạo']],['Cách viết nào đúng?','Đội Thiếu niên Tiền phong Hồ Chí Minh',['đội thiếu niên tiền phong Hồ Chí Minh','Đội thiếu niên tiền phong hồ chí minh','Đội Thiếu Niên tiền phong Hồ chí Minh']],['Cách viết nào đúng?','Trường Đại học Sư phạm Hà Nội',['trường đại học sư phạm Hà Nội','Trường đại học sư phạm hà nội','Trường Đại Học sư phạm Hà nội']],['Cách viết nào đúng?','Hội Chữ thập đỏ Việt Nam',['hội chữ thập đỏ Việt Nam','Hội chữ thập đỏ việt nam','Hội Chữ Thập Đỏ việt Nam']]],{long:true});

 {t:'Người giữ rừng',p:'Ông Sáu đã gắn bó với cánh rừng đầu nguồn hơn hai mươi năm. Ngày ngày, ông đi tuần tra, nhắc nhở mọi người không chặt cây, không đốt rừng làm rẫy. Mùa khô, ông cùng thanh niên trong bản dọn cỏ khô, làm đường băng cản lửa. Nhờ có ông, cánh rừng vẫn xanh tốt, dòng suối dưới chân núi chưa bao giờ cạn.',q:[['Ông Sáu gắn bó với cánh rừng bao lâu?','Hơn hai mươi năm',['Hai năm','Mười năm','Năm mươi năm']],['Mùa khô, ông Sáu làm gì?','Cùng thanh niên dọn cỏ khô, làm đường băng cản lửa',['Đi lên thành phố','Trồng lúa nương','Bắt cá dưới suối']],['Nhờ có ông Sáu, điều gì đã xảy ra?','Cánh rừng vẫn xanh tốt, dòng suối chưa bao giờ cạn',['Bản làng có điện','Có thêm nhiều nương rẫy','Mọi người chuyển đi nơi khác']],['Trong câu “Mùa khô, ông cùng thanh niên trong bản dọn cỏ khô…”, “Mùa khô” là trạng ngữ chỉ gì?','Thời gian',['Nơi chốn','Nguyên nhân','Mục đích']]]},
 {t:'Cánh diều tuổi thơ',p:'Chiều nào bọn trẻ trong xóm cũng rủ nhau ra bãi cỏ bên đê thả diều. Chiếc diều của Tí làm bằng giấy báo, đuôi dài thướt tha. Gió nam thổi lồng lộng, cánh diều chao nghiêng rồi vút lên cao. Tí ngửa cổ nhìn theo, lòng phơi phới như chính mình cũng đang bay.',q:[['Bọn trẻ thả diều ở đâu?','Trên bãi cỏ bên đê',['Trên sân trường','Ngoài bờ biển','Trên sân thượng']],['Chiếc diều của Tí làm bằng gì?','Giấy báo',['Vải dù','Ni lông','Lá chuối']],['Tìm một tính từ trong câu “Chiếc diều của Tí làm bằng giấy báo, đuôi dài thướt tha.”','thướt tha',['chiếc diều','làm','giấy báo']],['Chủ ngữ của câu “Gió nam thổi lồng lộng.” là gì?','Gió nam',['thổi','lồng lộng','thổi lồng lộng']]]},
 {t:'Cô bé bán xôi',p:'Sáng nào Phượng cũng dậy sớm phụ mẹ bán xôi ở đầu ngõ trước khi đi học. Có hôm khách đông, Phượng vẫn nhanh nhẹn gói xôi, nhận tiền, trả lại tiền thừa không sai một đồng. Buổi chiều, em ngồi học bài bên chiếc bàn nhỏ cạnh bếp. Cuối năm, Phượng được nhận giấy khen học sinh xuất sắc.',q:[['Mỗi sáng, Phượng làm gì trước khi đi học?','Phụ mẹ bán xôi ở đầu ngõ',['Tập thể dục','Nấu cơm cho cả nhà','Dắt em đi học']],['Từ ngữ nào cho thấy Phượng làm việc giỏi?','nhanh nhẹn',['dậy sớm','đầu ngõ','chiếc bàn nhỏ']],['Cuối năm, Phượng được nhận gì?','Giấy khen học sinh xuất sắc',['Một chiếc xe đạp','Bộ quần áo mới','Một chuyến du lịch']]]},

cb('tv5_dongnghia','Từ đồng nghĩa là từ có nghĩa giống nhau hoặc gần giống nhau, có thể thay thế cho nhau trong câu.',[['Từ nào đồng nghĩa với <b>“siêng năng”</b>?','chăm chỉ',['lười biếng','nhanh nhẹn','hiền lành']],['Từ nào đồng nghĩa với <b>“dũng cảm”</b>?','can đảm',['nhút nhát','cẩn thận','vui vẻ']],['Từ nào đồng nghĩa với <b>“to lớn”</b>?','khổng lồ',['nhỏ bé','cao ráo','rộng rãi']],['Từ nào đồng nghĩa với <b>“bé nhỏ”</b>?','tí hon',['to lớn','gầy gò','xinh xắn']],['Từ nào đồng nghĩa với <b>“Tổ quốc”</b>?','đất nước',['quê nhà','làng xóm','thành phố']],['Từ nào đồng nghĩa với <b>“sung sướng”</b>?','hạnh phúc',['buồn bã','lo lắng','bình tĩnh']],['Từ nào đồng nghĩa với <b>“thông minh”</b>?','sáng dạ',['chậm chạp','chăm chỉ','ngoan ngoãn']],['Từ nào đồng nghĩa với <b>“bắt đầu”</b>?','khởi đầu',['kết thúc','tiếp tục','dừng lại']],['Từ nào đồng nghĩa với <b>“vội vàng”</b>?','hấp tấp',['thong thả','chậm rãi','cẩn thận']],['Từ nào đồng nghĩa với <b>“chăm sóc”</b>?','săn sóc',['bỏ mặc','nhìn ngắm','dạy dỗ']]]);
cb('tv5_trainghia','Từ trái nghĩa là những từ có nghĩa trái ngược nhau. Dùng từ trái nghĩa giúp làm nổi bật sự đối lập.',[['Từ nào trái nghĩa với <b>“hòa bình”</b>?','chiến tranh',['thái bình','bình yên','hạnh phúc']],['Từ nào trái nghĩa với <b>“đoàn kết”</b>?','chia rẽ',['thống nhất','gắn bó','yêu thương']],['Từ nào trái nghĩa với <b>“trung thực”</b>?','gian dối',['thật thà','ngay thẳng','chân thành']],['Từ nào trái nghĩa với <b>“cẩn thận”</b>?','cẩu thả',['chu đáo','kĩ lưỡng','chăm chỉ']],['Từ nào trái nghĩa với <b>“nhanh nhẹn”</b>?','chậm chạp',['hoạt bát','lanh lợi','khéo léo']],['Cặp từ nào trái nghĩa với nhau?','sống – chết',['đẹp – xinh','to – lớn','vui – mừng']],['Cặp từ nào trái nghĩa với nhau?','khen – chê',['nói – kể','đi – chạy','xem – nhìn']],['Câu tục ngữ nào có cặp từ trái nghĩa?','Lá lành đùm lá rách.',['Uống nước nhớ nguồn.','Có công mài sắt, có ngày nên kim.','Tốt gỗ hơn tốt nước sơn.']]],{long:true});
cb('tv5_danghia','Từ đa nghĩa có một nghĩa gốc và một hay nhiều nghĩa chuyển. Nghĩa gốc thường chỉ bộ phận cơ thể người, con vật hoặc nghĩa ban đầu của từ.',[['Từ <b>“chân”</b> trong câu nào được dùng với nghĩa gốc?','Bé ngã đau chân.',['Chân bàn bị gãy.','Chân núi có một ngôi làng nhỏ.','Chân trời rực đỏ lúc hoàng hôn.']],['Từ <b>“mắt”</b> trong câu nào được dùng với nghĩa gốc?','Đôi mắt em bé đen láy.',['Quả na đã mở mắt.','Mắt lưới rất nhỏ.','Cây tre có nhiều mắt.']],['Từ <b>“đầu”</b> trong câu nào được dùng với nghĩa chuyển?','Nhà em ở đầu làng.',['Bé đội mũ lên đầu.','Em gật đầu chào cô.','Mẹ chải đầu cho bé.']],['Từ <b>“chạy”</b> trong câu nào được dùng với nghĩa chuyển?','Đồng hồ chạy rất đúng giờ.',['Nam chạy về đích đầu tiên.','Con ngựa chạy nhanh như gió.','Các bạn chạy nhảy trên sân.']],['Từ <b>“ăn”</b> trong câu nào được dùng với nghĩa gốc?','Cả nhà đang ăn cơm.',['Tàu ăn hàng ở cảng.','Da bé ăn nắng.','Hồ dán ăn vào giấy.']],['Từ <b>“lưỡi”</b> trong câu nào được dùng với nghĩa chuyển?','Lưỡi liềm sáng loáng.',['Bé thè lưỡi trêu mẹ.','Con mèo liếm lưỡi.','Lưỡi em bị bỏng vì canh nóng.']],['Từ <b>“mũi”</b> trong câu nào được dùng với nghĩa gốc?','Bé bị sổ mũi.',['Mũi thuyền rẽ sóng.','Mũi kim rất nhọn.','Mũi Cà Mau ở cực nam Tổ quốc.']],['Từ <b>“tay”</b> trong câu nào được dùng với nghĩa chuyển?','Anh ấy là một tay vợt giỏi.',['Em rửa tay trước khi ăn.','Bé vẫy tay chào bà.','Tay mẹ ấm áp.']]],{long:true});
cb('tv5_daitu','Đại từ dùng để xưng hô (tôi, chúng tôi, chúng ta, bạn, nó, họ…) hoặc để thay thế cho danh từ, động từ, tính từ, cụm từ, tránh lặp lại.',[['Từ nào là đại từ xưng hô?','tôi',['bàn','chạy','đẹp']],['Từ nào là đại từ xưng hô?','chúng tôi',['sân trường','học bài','xanh tươi']],['Từ nào là đại từ xưng hô?','chúng ta',['ngôi nhà','nhảy dây','chăm chỉ']],['Từ nào là đại từ xưng hô?','họ',['hoa','hát','vui']],['Từ nào là đại từ xưng hô?','nó',['mèo','ngủ','ngoan']],['Trong đoạn <b>“Lan rất chăm học. Bạn ấy luôn được cô khen.”</b>, từ “bạn ấy” thay thế cho từ nào?','Lan',['cô','chăm học','khen']],['Trong câu <b>“Nam thích bóng đá, em cũng vậy.”</b>, từ “vậy” thay thế cho cụm từ nào?','thích bóng đá',['Nam','em','bóng đá']],['Trong đoạn <b>“Con mèo nhà em rất lười. Nó suốt ngày nằm ngủ.”</b>, từ “nó” thay thế cho cụm từ nào?','Con mèo nhà em',['nằm ngủ','rất lười','em']]],{long:true});
cb('tv5_ketu','Xem quan hệ giữa hai ý: trái ngược → nhưng, tuy … nhưng; nguyên nhân – kết quả → vì … nên; điều kiện → nếu … thì; tăng tiến → không những … mà còn.',[['Chọn từ thích hợp: <b>… trời mưa to … em vẫn đến lớp đúng giờ.</b>','Tuy – nhưng',['Vì – nên','Nếu – thì','Không những – mà còn']],['Chọn từ thích hợp: <b>… chăm học … Nam đã đạt điểm cao trong kì thi.</b>','Vì – nên',['Tuy – nhưng','Hễ – thì','Không những – mà còn']],['Chọn từ thích hợp: <b>… ngày mai trời đẹp … lớp em sẽ đi tham quan.</b>','Nếu – thì',['Tuy – nhưng','Không những – mà còn','Vì – nên']],['Chọn từ thích hợp: <b>Lan … học giỏi … còn hát rất hay.</b>','không những – mà',['tuy – nhưng','nếu – thì','vì – nên']],['Chọn từ thích hợp: <b>Em thích đọc truyện … em trai em thích vẽ tranh.</b>','còn',['vì','nếu','nên']],['Chọn từ thích hợp: <b>Mẹ mua cho em quyển sách … cây bút mới.</b>','và',['nhưng','vì','nên']],['Chọn từ thích hợp: <b>Bài toán khó … Minh vẫn giải được.</b>','nhưng',['vì','và','nên']],['Chọn từ thích hợp: <b>Cây lúa xanh tốt … được bón phân đầy đủ.</b>','vì',['nhưng','nếu','còn']]],{long:true});
cb('tv5_caughep','Câu ghép do nhiều vế câu ghép lại; mỗi vế thường có đủ chủ ngữ và vị ngữ. Các vế nối với nhau bằng kết từ, cặp kết từ hoặc dấu câu.',[['Câu nào là câu ghép?','Trời mưa to, đường ngập nước.',['Sáng nay, em đi học sớm.','Những bông hoa đua nhau nở.','Bà em trồng rau ngoài vườn.']],['Câu nào là câu ghép?','Vì trời rét nên em mặc áo ấm.',['Em mặc áo ấm vào mùa đông.','Mùa đông, trời rất rét.','Chiếc áo ấm của em màu đỏ.']],['Câu nào là câu ghép?','Mẹ nấu cơm, còn chị quét nhà.',['Mẹ và chị cùng làm việc nhà.','Mẹ nấu cơm rất ngon.','Buổi chiều, mẹ đi chợ.']],['Câu nào là câu ghép?','Nếu em chăm học thì em sẽ tiến bộ.',['Em chăm học để tiến bộ.','Em rất chăm học.','Bạn Lan học giỏi nhất lớp.']],['Câu <b>“Gió thổi mạnh, cây cối nghiêng ngả.”</b> có mấy vế câu?','Hai vế',['Một vế','Ba vế','Bốn vế']],['Câu <b>“Mặt trời lên, sương tan dần, chim hót vang.”</b> có mấy vế câu?','Ba vế',['Một vế','Hai vế','Bốn vế']],['Trong câu <b>“Tuy nhà xa nhưng Hà luôn đến lớp đúng giờ.”</b>, các vế được nối bằng gì?','Cặp kết từ “tuy … nhưng”',['Dấu phẩy','Dấu chấm phẩy','Từ “luôn”']]],{long:true});
cb('tv5_lienket','Các câu trong đoạn văn liên kết với nhau bằng cách lặp lại từ ngữ, thay thế từ ngữ (dùng đại từ hoặc từ đồng nghĩa), hoặc dùng từ ngữ nối (vì vậy, tuy nhiên, sau đó…).',[['<b>“Nhà em có một con chó. Con chó rất khôn.”</b> Câu thứ hai liên kết với câu thứ nhất bằng cách nào?','Lặp lại từ ngữ',['Thay thế từ ngữ','Dùng từ ngữ nối','Không có liên kết']],['<b>“Bác Hồ rất yêu thiếu nhi. Người thường gửi thư khen các cháu.”</b> Câu thứ hai liên kết với câu thứ nhất bằng cách nào?','Thay thế từ ngữ',['Lặp lại từ ngữ','Dùng từ ngữ nối','Không có liên kết']],['<b>“Trời mưa rất to. Vì vậy, trận đấu bị hoãn lại.”</b> Câu thứ hai liên kết với câu thứ nhất bằng cách nào?','Dùng từ ngữ nối',['Lặp lại từ ngữ','Thay thế từ ngữ','Không có liên kết']],['<b>“Lan học rất giỏi. Tuy nhiên, bạn ấy còn ngại phát biểu.”</b> Từ ngữ nào dùng để nối hai câu?','Tuy nhiên',['học rất giỏi','phát biểu','Lan']],['<b>“Cây phượng già đứng ở góc sân. Mùa hè, cây phượng nở hoa đỏ rực.”</b> Từ ngữ nào được lặp lại để liên kết hai câu?','cây phượng',['góc sân','mùa hè','đỏ rực']],['<b>“Minh rất thích đọc sách. Cậu bé dành cả buổi chiều ở thư viện.”</b> Từ ngữ nào thay thế cho “Minh”?','Cậu bé',['đọc sách','thư viện','buổi chiều']]],{long:true});
cb('tv5_daucau','Dấu gạch ngang dùng để đánh dấu lời nói nhân vật, đánh dấu phần chú thích, các ý liệt kê, hoặc nối các từ trong một liên danh (tuyến Hà Nội – Hải Phòng). Dấu phẩy ngăn cách các vế câu, các bộ phận cùng chức vụ, trạng ngữ với chủ ngữ.',[['Dấu gạch ngang trong cụm <b>“tuyến đường sắt Hà Nội – Hải Phòng”</b> dùng để làm gì?','Nối các từ trong một liên danh',['Đánh dấu lời nói của nhân vật','Đánh dấu phần chú thích','Đánh dấu các ý liệt kê']],['Dấu gạch ngang trong câu <b>“Nam – lớp trưởng lớp em – rất gương mẫu.”</b> dùng để làm gì?','Đánh dấu phần chú thích',['Đánh dấu lời nói của nhân vật','Nối các từ trong một liên danh','Đánh dấu các ý liệt kê']],['Dấu phẩy trong câu <b>“Sáng sớm, sương phủ trắng cánh đồng.”</b> dùng để làm gì?','Ngăn cách trạng ngữ với chủ ngữ và vị ngữ',['Ngăn cách các vế câu ghép','Ngăn cách các từ cùng chức vụ','Đánh dấu kết thúc câu']],['Dấu phẩy trong câu <b>“Gió thổi, mây bay, lá rơi.”</b> dùng để làm gì?','Ngăn cách các vế câu ghép',['Ngăn cách trạng ngữ với chủ ngữ','Đánh dấu phần chú thích','Đánh dấu lời nói']],['Dấu phẩy trong câu <b>“Vườn nhà em có cam, bưởi, nhãn.”</b> dùng để làm gì?','Ngăn cách các từ cùng chức vụ',['Ngăn cách các vế câu ghép','Ngăn cách trạng ngữ với chủ ngữ','Đánh dấu phần chú thích']]],{long:true});
rd('tv5_doc',[
 {t:'Mùa lúa chín',p:'Cuối tháng năm, cánh đồng làng em vàng rực một màu lúa chín. Gió thổi qua, cả biển lúa nhấp nhô, dập dờn như sóng. Từ tờ mờ sáng, các bác nông dân đã ra đồng, tiếng cười nói vang khắp bờ ruộng. Máy gặt chạy đến đâu, những bao thóc mẩy hạt được xếp ngay ngắn đến đó. Mùi rơm rạ thơm nồng lan khắp thôn xóm.',q:[['Lúa chín vào thời gian nào?','Cuối tháng năm',['Đầu tháng giêng','Giữa tháng tám','Cuối tháng mười hai']],['Biển lúa nhấp nhô được so sánh với gì?','Sóng',['Tấm thảm','Mặt trời','Dòng sông']],['Từ “chạy” trong câu “Máy gặt chạy đến đâu…” được dùng với nghĩa nào?','Nghĩa chuyển',['Nghĩa gốc']],['Câu “Máy gặt chạy đến đâu, những bao thóc mẩy hạt được xếp ngay ngắn đến đó.” là câu gì?','Câu ghép',['Câu đơn','Câu hỏi','Câu khiến'],'Câu có hai vế, mỗi vế có chủ ngữ và vị ngữ, nối với nhau bằng cặp từ “đến đâu … đến đó”.']]},
 {t:'Người thầy vùng cao',p:'Thầy Minh dạy ở một điểm trường vùng cao. Con đường đến trường dài gần mười cây số, mùa mưa trơn trượt, có đoạn phải lội qua suối. Thầy vẫn đều đặn lên lớp, chưa bỏ buổi nào. Ngoài giờ học, thầy dạy các em trồng rau, nuôi gà để cải thiện bữa ăn. Học sinh coi thầy như người cha thứ hai.',q:[['Thầy Minh dạy học ở đâu?','Một điểm trường vùng cao',['Một trường ở thành phố','Một trường ven biển','Một trung tâm ngoại ngữ']],['Mùa mưa, đường đến trường thế nào?','Trơn trượt, có đoạn phải lội qua suối',['Bằng phẳng, dễ đi','Có xe buýt đưa đón','Được rải nhựa']],['Ngoài giờ học, thầy dạy các em làm gì?','Trồng rau, nuôi gà để cải thiện bữa ăn',['Chơi đàn, hát múa','Đan lát, thêu thùa','Sửa chữa đồ dùng']],['Câu thứ ba liên kết với câu thứ nhất bằng cách nào?','Lặp lại từ ngữ (từ “thầy”)',['Dùng từ ngữ nối','Dùng đại từ thay thế','Không có liên kết']]]},
 {t:'Biển xanh trở lại',p:'Sáng chủ nhật, Đội thiếu niên phường em tổ chức buổi làm sạch bãi biển. Ai cũng mang theo găng tay, bao tải và kẹp gắp rác. Chỉ trong hai giờ, chúng em đã nhặt được hơn năm mươi bao rác, phần lớn là chai nhựa và túi ni lông. Nhìn bãi cát trắng sạch trở lại, ai cũng thấy vui. Chúng em hứa sẽ không xả rác và nhắc mọi người cùng giữ gìn biển đẹp.',q:[['Buổi sáng chủ nhật, Đội thiếu niên làm gì?','Làm sạch bãi biển',['Tắm biển','Thi bơi','Xây lâu đài cát']],['Rác nhặt được phần lớn là gì?','Chai nhựa và túi ni lông',['Lá cây khô','Vỏ sò, vỏ ốc','Gỗ mục']],['Từ “chúng em” trong bài thuộc từ loại nào?','Đại từ',['Danh từ','Động từ','Tính từ']],['Bài văn muốn nhắn gửi điều gì?','Hãy cùng nhau giữ gìn môi trường biển sạch đẹp',['Nên đi biển vào chủ nhật','Cần mang găng tay khi đi chơi','Bãi biển có nhiều chai nhựa']]]},
 {t:'Cây gạo đầu làng',p:'Cây gạo đầu làng đã sống hơn trăm năm. Mùa xuân, cây nở hoa đỏ rực như ngàn ngọn đuốc thắp sáng cả một góc trời. Chim chóc từ khắp nơi bay về, ríu rít trên các cành cao. Với người làng, cây gạo không chỉ là một cái cây mà còn là chứng nhân của bao kỉ niệm tuổi thơ.',q:[['Cây gạo đầu làng bao nhiêu tuổi?','Hơn trăm năm',['Mười năm','Năm mươi năm','Hai mươi năm']],['Hoa gạo được so sánh với gì?','Ngàn ngọn đuốc',['Ngọn lửa trại','Mặt trời','Những chiếc đèn lồng']],['Câu cuối dùng cặp kết từ nào?','không chỉ … mà còn',['vì … nên','tuy … nhưng','nếu … thì']]]},
]);
