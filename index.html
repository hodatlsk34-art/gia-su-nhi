<script>
/* ===== Chỉ mục bài học ===== */
const SUBJ={toan:'Toán',tv:'Tiếng Việt'};
const LES={};
for(const g of [1,2,3,4,5])for(const sub of ['toan','tv'])for(const cd of CUR[g][sub])for(const l of cd.lessons){const id=`${g}-${sub}-${l.b}`;l.id=id;LES[id]=Object.assign({g,sub,cd:cd.cd,cdName:cd.name,hk:cd.hk},l)}
const lname=l=>l.sub==='toan'?`Bài ${l.b}. ${l.name}`:l.name;
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();

/* ===== Lưu trữ trên thiết bị (chỉ tên gọi ở nhà + điểm) ===== */
const KEY='gsn.v2';
const uid=()=>Math.random().toString(36).slice(2,9);
let S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.kids&&v.kids.length)return v}catch(e){}
  try{const o=JSON.parse(localStorage.getItem('gsn.v1'));if(o&&o.kids&&o.kids.length)return {kids:o.kids,active:o.active,hist:{},last:{}}}catch(e){}
  return {kids:[{id:uid(),name:'Bé',grade:2}],active:null,hist:{},last:{}}})();
S.last||={};S.hist||={};
if(!S.active||!S.kids.find(k=>k.id===S.active))S.active=S.kids[0].id;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const kid=()=>S.kids.find(k=>k.id===S.active);
const hist=()=>(S.hist[S.active]||=[]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vn=n=>String(Math.round(n*10)/10).replace('.',',');
const $=s=>document.querySelector(s);
const app=$('#app');
let view={grade:null,sub:'toan',q:'',open:{}};

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2400)}

/* ===== Đọc đề bằng giọng tiếng Việt (nếu thiết bị có) ===== */
let viVoice=null;
function findVoice(){try{viVoice=speechSynthesis.getVoices().find(v=>/^vi/i.test(v.lang))||null}catch(e){viVoice=null}const b=document.querySelector('.say');if(b)b.hidden=!viVoice}
try{if('speechSynthesis' in window){findVoice();speechSynthesis.onvoiceschanged=findVoice}}catch(e){}
function speak(t){if(!viVoice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' '));u.lang='vi-VN';u.voice=viVoice;u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

function renderChip(){const k=kid();$('#kidChip').innerHTML=`${esc(k.name)} <span class="g">Lớp ${k.grade}</span>`}
$('#brand').onclick=()=>home();
$('#parentBtn').onclick=()=>gate();
$('#kidChip').onclick=()=>kidPicker();
const lastScore=lid=>{const h=hist().filter(x=>x.lid===lid);return h.length?h[h.length-1].score:null};
const doneSet=()=>new Set(hist().map(x=>x.lid));

/* ===== Trang chủ ===== */
const ICON_SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
function lessonRow(l){const s=lastScore(l.id);const prac=l.sk.length>0;
  return `<button class="lesson" ${prac?`data-l="${l.id}"`:'disabled'}>${l.sub==='toan'?`<span class="b">Bài ${l.b}</span>`:''}<span class="t">${esc(l.name)}${l.note?`<small>${esc(l.note)}</small>`:''}</span>${prac?`<span class="score-badge ${s==null?'none':''}">${s==null?'—':vn(s)}</span>`:'<span class="tag">Học ở lớp</span>'}</button>`}
function home(){
  const k=kid();if(view.grade==null)view.grade=k.grade;renderChip();
  const g=view.grade,sub=view.sub,cds=CUR[g][sub],done=doneSet();
  const lastId=S.last[S.active];const last=lastId&&LES[lastId];
  if(!Object.keys(view.open).length){const tgt=last&&last.g===g&&last.sub===sub?last.cd:cds[0].cd;view.open[`${g}-${sub}-${tgt}`]=true}
  let body='';
  if(view.q.trim()){const q=norm(view.q.trim());const hits=cds.flatMap(cd=>cd.lessons).filter(l=>norm(l.name).includes(q)||(l.sub==='toan'&&('bai '+l.b)===q));
    body=hits.length?`<div class="cd"><div class="cd-b" style="border:0">${hits.map(l=>lessonRow(LES[l.id])).join('')}</div></div>`:`<div class="empty">Không tìm thấy bài nào có “${esc(view.q)}” trong ${SUBJ[sub]} lớp ${g}.</div>`}
  else{let hk=0;body='<div class="cds">';for(const cd of cds){if(cd.hk!==hk){hk=cd.hk;body+=`</div><div class="hk">Học kì ${hk}${sub==='toan'?` · Tập ${hk}`:''}</div><div class="cds">`}
    const key=`${g}-${sub}-${cd.cd}`;const pr=cd.lessons.filter(l=>l.sk.length);const dn=pr.filter(l=>done.has(l.id)).length;const allSk=[...new Set(pr.flatMap(l=>l.sk))];
    body+=`<details class="cd" data-k="${key}" ${view.open[key]?'open':''}><summary class="cd-h" style="list-style:none"><span class="n">${cd.cd}</span><span class="t">${sub==='toan'?'Chủ đề '+cd.cd+'. ':''}${esc(cd.name)}<small>${dn}/${pr.length} bài đã luyện</small><span class="prog"><i style="width:${pr.length?Math.round(dn/pr.length*100):0}%"></i></span></span>${CHEV}</summary><div class="cd-b">${cd.lessons.map(l=>lessonRow(LES[l.id])).join('')}${allSk.length>1?`<button class="mix" data-mix="${key}">Luyện tổng hợp cả ${sub==='toan'?'chủ đề':'phần'} này</button>`:''}</div></details>`}
    body+='</div>'}
  const total=hist().length;
  app.innerHTML=`
  <section class="hello"><h1>Chào ${esc(k.name)}! Hôm nay mình học gì nào?</h1>
  <p class="muted" style="margin:0">${total?`Con đã hoàn thành ${total} bài luyện. Cố lên nhé!`:'Chọn một bài bên dưới. Làm sai cũng không sao, gia sư sẽ gợi ý cho con.'}</p></section>
  <div class="grades" role="group" aria-label="Chọn lớp">${[1,2,3,4,5].map(x=>`<button data-g="${x}" aria-pressed="${x===g}">Lớp ${x}</button>`).join('')}</div>
  <div class="toolbar"><div class="seg" role="group" aria-label="Chọn môn">${Object.entries(SUBJ).map(([s,n])=>`<button data-s="${s}" aria-pressed="${s===sub}">${n}</button>`).join('')}</div>
  <label class="search">${ICON_SEARCH}<input id="q" type="search" placeholder="Tìm bài…" value="${esc(view.q)}" aria-label="Tìm bài"></label></div>
  ${last&&!view.q?`<button class="cont" data-l="${last.id}"><span class="t"><small>Học tiếp · Lớp ${last.g} · ${SUBJ[last.sub]}</small><b>${esc(lname(last))}</b></span><span class="score-badge ${lastScore(last.id)==null?'none':''}">${lastScore(last.id)==null?'—':vn(lastScore(last.id))}</span></button>`:''}
  ${body}
  <p class="note">Toán theo đúng chủ đề, tên bài của SGK <i>Kết nối tri thức với cuộc sống</i>; đề được tạo mới mỗi lần làm. Tiếng Việt theo mạch kiến thức của Chương trình GDPT 2018, câu hỏi và bài đọc do Gia Sư Nhí tự soạn. Dữ liệu chỉ lưu trên thiết bị này, không thu thập thông tin cá nhân.</p>`;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{view.grade=+b.dataset.g;view.open={};home()});
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{view.sub=b.dataset.s;view.open={};home()});
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(b.dataset.l));
  app.querySelectorAll('[data-mix]').forEach(b=>b.onclick=()=>{const [g2,s2,c2]=b.dataset.mix.split('-');const cd=CUR[g2][s2].find(c=>String(c.cd)===c2);startMix(cd,g2,s2)});
  app.querySelectorAll('details.cd').forEach(d=>d.addEventListener('toggle',()=>{view.open[d.dataset.k]=d.open}));
  const qi=$('#q');qi.oninput=()=>{view.q=qi.value;const pos=qi.selectionStart;home();const n=$('#q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
}

/* ===== Làm bài ===== */
let Z=null;
function start(lid){const l=LES[lid];Z={lid,title:lname(l),sub:l.sub,g:l.g,qs:makeSession(l.sk),i:0,tries:0,res:[],done:false};S.last[S.active]=lid;save();renderQ();window.scrollTo(0,0)}
function startMix(cd,g,sub){const sk=[...new Set(cd.lessons.flatMap(l=>l.sk))];Z={lid:null,title:`Tổng hợp: ${cd.name}`,sub,g:+g,qs:makeSession(sk),i:0,tries:0,res:[],done:false};renderQ();window.scrollTo(0,0)}
function parseNum(s){s=String(s).trim().replace(/[\s ]/g,'');if(!s)return NaN;if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');if(!/^\d*\.?\d+$/.test(s))return NaN;return parseFloat(s)}
const showAns=q=>q.kind==='choice'?(q.labels?q.labels[q.answer]:q.answer):q.kind==='frac'?`${q.answer[0]}/${q.answer[1]}`:fmt(q.answer)+(q.unit?' '+q.unit:'');
const plain=s=>String(s).replace(/<span class="frac"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g,' $1/$2 ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
function renderQ(){
  const q=Z.qs[Z.i],n=Z.qs.length;
  const track=Z.qs.map((_,j)=>`<i class="${j<Z.res.length?Z.res[j]:j===Z.i?'cur':''}"></i>`).join('');
  const body=q.eq?`<div class="qeq">${q.eq.replace('☐','<span class="box">☐</span>')}</div>`:q.html&&!q.text?`<div class="${/class="word"/.test(q.html)?'':/^<span class="frac"/.test(q.html)?'qfrac':'qhtml'}">${q.html}</div>`:`<div class="qtext">${q.text}</div>${q.html?`<div class="qhtml">${q.html}</div>`:''}`;
  const isSyms=q.kind==='choice'&&q.choices.every(c=>CMP.includes(c))&&!q.labels;
  let ans;
  if(q.kind==='choice')ans=`<div class="choices ${q.long?'long':''} ${isSyms?'syms':''}">${q.choices.map((c,j)=>`<button class="choice ${isSyms?'sym':''}" data-c="${j}">${q.html_choices?c:esc(q.labels?q.labels[c]:c)}</button>`).join('')}</div>`;
  else if(q.kind==='frac')ans=`<form class="answer" id="af" autocomplete="off"><span class="fracin"><input id="fa" inputmode="numeric" aria-label="Tử số" placeholder="tử"><hr><input id="fb2" inputmode="numeric" aria-label="Mẫu số" placeholder="mẫu"></span><button class="btn primary" type="submit">Kiểm tra</button></form>`;
  else ans=`<form class="answer" id="af" autocomplete="off"><input id="ans" inputmode="decimal" aria-label="Nhập đáp số" placeholder="?">${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}<button class="btn primary" type="submit">Kiểm tra</button></form>`;
  app.innerHTML=`
  <div class="qbar"><button class="small-btn" id="quit">← Thoát</button><span class="ttl">${esc(Z.title)}</span><span class="muted num">Câu ${Z.i+1}/${n}</span></div>
  <div class="track" aria-hidden="true">${track}</div>
  <article class="sheet pop">
    <span class="qno">${Z.i+1}</span>
    ${q.passage?`<div class="passage">${q.passage}</div>`:''}
    ${q.lead?`<div class="qlead">${q.lead}</div>`:''}
    ${body}
    ${q.fig||''}
    <button class="say" id="say" ${viVoice?'':'hidden'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Đọc đề</button>
    ${ans}
    <div id="fb"></div>
  </article>`;
  $('#quit').onclick=()=>home();
  $('#say').onclick=()=>speak(q.speak||plain(q.text||q.html||''));
  if(q.kind==='choice')app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>check(q.choices[+b.dataset.c],b));
  else if(q.kind==='frac'){$('#af').onsubmit=e=>{e.preventDefault();const a=parseInt($('#fa').value,10),b=parseInt($('#fb2').value,10);if(!(a>=0)||!(b>0)){showFb('hint','Con hãy nhập đủ tử số và mẫu số nhé.','Mẫu số phải lớn hơn 0.');return}check([a,b])}}
  else{const inp=$('#ans');setTimeout(()=>inp.focus({preventScroll:true}),30);$('#af').onsubmit=e=>{e.preventDefault();const v=parseNum(inp.value);if(isNaN(v)){showFb('hint','Con hãy nhập một số nhé.','Ví dụ: 12 hoặc 3,5');return}check(v)}}
}
function showFb(kind,title,msg,extra){$('#fb').innerHTML=`<div class="fb ${kind}" role="status"><b>${title}</b>${msg?`<span>${msg}</span>`:''}${extra||''}</div>`}
const PRAISE=['Đúng rồi! Giỏi quá!','Chính xác!','Tuyệt vời!','Đúng rồi, con làm tốt lắm!','Hoan hô, đúng rồi!'];
function judge(q,v){
  if(q.kind==='choice')return {ok:v===q.answer};
  if(q.kind==='frac'){const [a,b]=v,[x,y]=q.answer;const same=a*y===b*x;if(q.exact)return {ok:a===x&&b===y,near:same&&!(a===x&&b===y)?'Đúng giá trị, nhưng đề bài cần viết đúng phân số đó, chưa rút gọn.':null};
    if(!same)return {ok:false};const g=gcd(a,b);if(q.simplest&&g>1)return {ok:false,near:'Đúng giá trị rồi, nhưng phân số chưa tối giản. Con rút gọn tiếp nhé.'};return {ok:true,note:g>1?`Có thể rút gọn thành ${a/g}/${b/g}.`:''}}
  return {ok:Math.abs(v-q.answer)<1e-6};
}
function check(v,btn){
  if(Z.done)return;
  const q=Z.qs[Z.i];const r=judge(q,v);
  const twoChoice=q.kind==='choice'&&q.choices.length<=2;
  if(r.ok){
    Z.res.push(Z.tries?'half':'ok');Z.done=true;if(btn)btn.classList.add('right');lock();
    showFb('ok',pick(PRAISE),[Z.tries?'Lần sau con cố gắng đúng ngay từ lần đầu nhé.':'',r.note||''].filter(Boolean).join(' '),q.col||'');next();
  }else if(Z.tries===0&&!twoChoice){
    Z.tries=1;if(btn){btn.classList.add('wrong');btn.disabled=true}
    showFb('hint',r.near?'Gần đúng rồi!':'Chưa đúng rồi, con thử lại nhé!',r.near?r.near:`<strong>Gợi ý:</strong> ${q.hint}`,q.hintHtml?`<div>${q.hintHtml}</div>`:'');
    const inp=$('#ans')||$('#fa');if(inp)inp.select();
  }else{
    Z.res.push('no');Z.done=true;if(btn)btn.classList.add('wrong');lock(true);
    showFb('bad',`Đáp án đúng là: ${q.html_choices?q.answer:esc(showAns(q))}`,q.explain+(twoChoice?`<br><strong>Mẹo nhớ:</strong> ${q.hint}`:''),q.col||'');next();
  }
}
function lock(markRight){const q=Z.qs[Z.i];app.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(markRight&&q.choices[+b.dataset.c]===q.answer)b.classList.add('right')});app.querySelectorAll('#af input,#af button').forEach(x=>x.disabled=true)}
function next(){
  const last=Z.i===Z.qs.length-1;
  const a=document.createElement('div');a.className='actions';a.innerHTML=`<button class="btn primary" id="nx">${last?'Xem điểm':'Câu tiếp theo →'}</button>`;
  $('#fb').appendChild(a);const b=$('#nx');b.focus({preventScroll:true});b.scrollIntoView({block:'nearest',behavior:'smooth'});
  b.onclick=()=>{if(last)finish();else{Z.i++;Z.tries=0;Z.done=false;renderQ();window.scrollTo(0,0)}};
}

/* ===== Kết quả ===== */
function finish(){
  const pts=Z.res.reduce((s,r)=>s+(r==='ok'?1:r==='half'?.5:0),0);
  const score=Math.round(pts/Z.qs.length*10*2)/2;
  if(Z.lid){hist().push({lid:Z.lid,score,n:Z.qs.length,ok:Z.res.filter(r=>r==='ok').length,t:Date.now()});save()}
  const phe=score>=9?'Rất giỏi! Con hãy giữ vững phong độ nhé.':score>=7?'Khá lắm! Ôn lại những câu sai là con sẽ đạt điểm 10.':score>=5?'Con đã cố gắng. Làm lại một lần nữa sẽ tiến bộ hơn.':'Không sao đâu! Con đọc kĩ gợi ý rồi làm lại nhé.';
  const st=score>=9?3:score>=7?2:score>=5?1:0;
  const star=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="${on?'var(--amber-line)':'none'}" stroke="${on?'var(--amber)':'var(--line-strong)'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  const items=Z.qs.map((q,j)=>{const r=Z.res[j];const p=plain(q.eq||((q.text||'')+' '+(q.html||'')));
    return `<li><span class="st ${r}">${r==='ok'?'Đ':r==='half'?'½':'S'}</span><span class="q">${esc(p)}<small>Đáp án: ${esc(plain(showAns(q)))}${r==='no'?' — '+esc(plain(q.explain)):''}</small></span></li>`}).join('');
  app.innerHTML=`
  <section class="result">
    <div class="sheet grade-card">
      <div class="mark" aria-label="Điểm ${vn(score)}"><div><small>Điểm</small><span class="num">${vn(score)}</span></div></div>
      <div class="loi-phe"><div class="lbl">Lời phê của gia sư</div><p>${phe}</p><div class="stars" aria-label="${st} sao">${star(st>=1)}${star(st>=2)}${star(st>=3)}</div></div>
    </div>
    <div class="actions"><button class="btn primary" id="again">Làm lại bài này</button>${Z.lid?'<button class="btn ghost" id="nextL">Bài tiếp theo →</button>':''}<button class="btn ghost" id="back">Về danh sách bài</button></div>
    <h2 style="font-size:1.15rem">Xem lại bài làm</h2>
    <ul class="review">${items}</ul>
    <p class="muted" style="font-size:.85rem;margin:0">Đ: đúng ngay lần đầu · ½: đúng sau gợi ý · S: chưa đúng.</p>
  </section>`;
  const prev=Z;$('#again').onclick=()=>{if(prev.lid)start(prev.lid);else{Z=Object.assign({},prev,{qs:makeSession([...new Set(prev.qs.map(q=>q.skill))]),i:0,tries:0,res:[],done:false});renderQ()}};
  $('#back').onclick=()=>home();
  const nb=$('#nextL');if(nb){const all=Object.values(LES).filter(l=>l.g===prev.g&&l.sub===prev.sub&&l.sk.length);const i=all.findIndex(l=>l.id===prev.lid);if(i<0||i===all.length-1)nb.remove();else nb.onclick=()=>start(all[i+1].id)}
  window.scrollTo(0,0);
}

/* ===== Chọn bé ===== */
function kidPicker(){
  const ov=$('#overlay');
  ov.innerHTML=`<div class="panel" role="dialog" aria-label="Chọn bé"><h2 style="font-size:1.2rem">Ai đang học?</h2><div class="kids">${S.kids.map(k=>`<button class="kid ${k.id===S.active?'on':''}" data-k="${k.id}"><span class="nm">${esc(k.name)}</span><span class="muted">Lớp ${k.grade}</span></button>`).join('')}</div><p class="muted" style="margin:0;font-size:.85rem">Thêm bé, đổi tên hoặc đổi lớp trong khu vực Phụ huynh.</p><button class="btn ghost" id="ovx">Đóng</button></div>`;
  ov.hidden=false;
  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.active=b.dataset.k;save();view.grade=null;view.open={};ov.hidden=true;home()});
  $('#ovx').onclick=()=>ov.hidden=true;ov.onclick=e=>{if(e.target===ov)ov.hidden=true};
}

/* ===== Khu vực phụ huynh ===== */
function gate(){
  const a=R(6,9),b=R(6,9);
  app.innerHTML=`<section class="stack"><div class="panel" style="display:grid;gap:12px;max-width:440px">
  <h2 style="font-size:1.3rem">Khu vực dành cho phụ huynh</h2>
  <p class="muted" style="margin:0">Để vào, xin trả lời câu hỏi sau. Phần này giúp các bé không vô tình thay đổi cài đặt.</p>
  <form id="gf" class="row" autocomplete="off"><div class="field"><label for="ga">${a} × ${b} = ?</label><input id="ga" inputmode="numeric"></div><button class="btn primary" style="align-self:end">Vào</button></form>
  <div id="gm"></div><button class="small-btn" id="gb" style="justify-self:start">← Về trang học</button></div></section>`;
  $('#ga').focus();$('#gb').onclick=()=>home();
  $('#gf').onsubmit=e=>{e.preventDefault();if(+$('#ga').value===a*b)parent();else $('#gm').innerHTML='<div class="fb bad"><b>Chưa đúng</b><span>Xin thử lại.</span></div>'};
}
function parent(){
  const k=kid(),h=hist().filter(x=>LES[x.lid]);renderChip();
  const avg=h.length?h.reduce((s,x)=>s+x.score,0)/h.length:0;
  const week=h.filter(x=>Date.now()-x.t<7*864e5).length;
  const by={};h.forEach(x=>{(by[x.lid]||=[]).push(x)});
  const rows=Object.keys(by).map(lid=>{const l=LES[lid];const a=by[lid];const av=a.reduce((s,x)=>s+x.score,0)/a.length;return {l,n:a.length,last:a[a.length-1].score,av}}).sort((x,y)=>x.av-y.av);
  const weak=rows.filter(r=>r.av<7);
  const cov=sub=>{const all=Object.values(LES).filter(l=>l.g===k.grade&&l.sub===sub&&l.sk.length);const d=all.filter(l=>by[l.id]).length;return {d,t:all.length}};
  const ct=cov('toan'),cv=cov('tv');
  const recent=h.slice(-8).reverse();
  const d=t=>new Date(t).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
  const bar=(c)=>`<span class="prog" style="height:7px"><i style="width:${c.t?Math.round(c.d/c.t*100):0}%"></i></span>`;
  app.innerHTML=`<section class="stack">
  <div class="row"><h1 style="font-size:1.6rem;flex:1">Theo dõi học tập</h1><button class="small-btn" id="pb">← Về trang học</button></div>
  <div class="panel" style="display:grid;gap:12px">
    <h2 style="font-size:1.15rem">${esc(k.name)} · Lớp ${k.grade}</h2>
    <div class="kpis"><div class="kpi"><b>${h.length}</b><span>bài đã làm</span></div><div class="kpi"><b>${week}</b><span>bài trong 7 ngày</span></div><div class="kpi"><b>${h.length?vn(avg):'—'}</b><span>điểm trung bình</span></div></div>
    <div style="display:grid;gap:8px"><div><div class="row" style="justify-content:space-between"><span>Toán lớp ${k.grade}</span><span class="muted num">${ct.d}/${ct.t} bài</span></div>${bar(ct)}</div><div><div class="row" style="justify-content:space-between"><span>Tiếng Việt lớp ${k.grade}</span><span class="muted num">${cv.d}/${cv.t} bài</span></div>${bar(cv)}</div></div>
    ${weak.length?`<div><span class="pill warn">Cần ôn thêm</span> ${weak.slice(0,6).map(r=>esc(r.l.name)).join('; ')}</div>`:h.length?`<div><span class="pill good">Học tốt</span> Chưa có bài nào dưới 7 điểm.</div>`:'<p class="muted" style="margin:0">Bé chưa làm bài nào. Kết quả sẽ hiện ở đây sau mỗi bài luyện.</p>'}
    ${rows.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Bài</th><th style="text-align:right">Lượt</th><th style="text-align:right">Gần nhất</th><th style="text-align:right">TB</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.l.name)}<br><span class="muted" style="font-size:.78rem">${SUBJ[r.l.sub]} · Lớp ${r.l.g}${r.l.sub==='toan'?' · Bài '+r.l.b:''}</span></td><td class="n">${r.n}</td><td class="n">${vn(r.last)}</td><td class="n">${vn(r.av)}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${recent.length?`<details><summary style="cursor:pointer;font-weight:600">Lần làm gần đây</summary><ul class="review" style="margin-top:8px">${recent.map(x=>`<li><span class="q">${esc(LES[x.lid].name)}<small>${d(x.t)} · ${x.ok}/${x.n} câu đúng ngay lần đầu</small></span><b class="num" style="color:var(--red)">${vn(x.score)}</b></li>`).join('')}</ul></details>`:''}
    <div class="row"><button class="btn primary" id="copy">Sao chép báo cáo gửi Zalo</button></div>
    <div id="cpbox"></div>
  </div>
  <div class="panel" style="display:grid;gap:12px">
    <h2 style="font-size:1.15rem">Các bé trong gia đình</h2>
    <div class="kids">${S.kids.map(x=>`<div class="kid ${x.id===S.active?'on':''}"><span class="nm">${esc(x.name)}</span><span class="muted">Lớp ${x.grade}</span>${x.id!==S.active?`<button class="small-btn" data-use="${x.id}">Chọn</button>`:''}</div>`).join('')}</div>
    <form id="kf" class="row" autocomplete="off">
      <div class="field"><label for="kn">Tên gọi ở nhà của bé đang chọn</label><input id="kn" maxlength="20" value="${esc(k.name)}"></div>
      <div class="field" style="max-width:130px"><label for="kg">Lớp</label><select id="kg">${[1,2,3,4,5].map(g=>`<option ${g===k.grade?'selected':''}>${g}</option>`).join('')}</select></div>
      <button class="btn primary" style="align-self:end">Lưu</button>
    </form>
    <p class="muted" style="margin:0;font-size:.85rem">Chỉ cần tên gọi ở nhà (ví dụ: Bin, Na). Không nhập họ tên đầy đủ.</p>
    <div class="row"><button class="small-btn" id="addk">+ Thêm bé</button>${S.kids.length>1?'<button class="small-btn" id="delk">Xóa bé đang chọn</button>':''}<button class="small-btn" id="clr">Xóa kết quả của bé</button></div>
    <div id="cf"></div>
  </div>
  <p class="note" style="margin-top:0">Dữ liệu lưu trên trình duyệt của thiết bị này. Xóa dữ liệu duyệt web hoặc dùng chế độ ẩn danh sẽ mất kết quả. Mỗi máy theo dõi riêng.</p>
  </section>`;
  $('#pb').onclick=()=>{view.grade=null;view.open={};home()};
  app.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.active=b.dataset.use;save();parent()});
  $('#kf').onsubmit=e=>{e.preventDefault();const nm=$('#kn').value.trim()||'Bé';k.name=nm.slice(0,20);k.grade=+$('#kg').value;save();view.grade=null;view.open={};toast('Đã lưu');parent()};
  $('#addk').onclick=()=>{const nk={id:uid(),name:'Bé '+(S.kids.length+1),grade:1};S.kids.push(nk);S.active=nk.id;save();toast('Đã thêm bé. Hãy đặt tên và chọn lớp.');parent();setTimeout(()=>$('#kn')?.select(),50)};
  const ask=(msg,fn)=>{$('#cf').innerHTML=`<div class="confirm"><span>${msg}</span><div class="row"><button class="btn danger" id="cy">Xóa</button><button class="btn ghost" id="cn">Không</button></div></div>`;$('#cy').onclick=fn;$('#cn').onclick=()=>$('#cf').innerHTML=''};
  $('#clr').onclick=()=>ask(`Xóa toàn bộ ${h.length} kết quả của ${esc(k.name)}? Không thể khôi phục.`,()=>{S.hist[S.active]=[];delete S.last[S.active];save();toast('Đã xóa kết quả');parent()});
  const dk=$('#delk');if(dk)dk.onclick=()=>ask(`Xóa bé ${esc(k.name)} cùng toàn bộ kết quả?`,()=>{delete S.hist[S.active];delete S.last[S.active];S.kids=S.kids.filter(x=>x.id!==S.active);S.active=S.kids[0].id;save();toast('Đã xóa');parent()});
  $('#copy').onclick=()=>{
    const lines=[`BÁO CÁO HỌC TẬP – ${k.name} (Lớp ${k.grade})`,`Ngày ${new Date().toLocaleDateString('vi-VN')}`,`Đã làm: ${h.length} bài (${week} bài trong 7 ngày)`];
    if(h.length)lines.push(`Điểm trung bình: ${vn(avg)}`);
    lines.push(`Tiến độ lớp ${k.grade}: Toán ${ct.d}/${ct.t} bài, Tiếng Việt ${cv.d}/${cv.t} bài`,'');
    rows.slice().sort((x,y)=>y.n-x.n).slice(0,12).forEach(r=>lines.push(`• ${SUBJ[r.l.sub]} – ${r.l.sub==='toan'?'Bài '+r.l.b+'. ':''}${r.l.name}: ${r.n} lượt, gần nhất ${vn(r.last)} điểm`));
    if(weak.length)lines.push('',`Cần ôn thêm: ${weak.slice(0,6).map(r=>r.l.name).join('; ')}`);
    const txt=lines.join('\n').trim();
    const fallback=()=>{$('#cpbox').innerHTML=`<p class="muted" style="margin:0 0 6px;font-size:.85rem">Thiết bị chưa cho phép sao chép tự động. Hãy chọn đoạn dưới đây rồi sao chép:</p><textarea id="cpt" readonly>${esc(txt)}</textarea>`;$('#cpt').select()};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép. Mở Zalo và dán để gửi.'),fallback)}catch(e){fallback()}
  };
}

home();
</script>
